<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日本語学習 — Japanese Learning Games</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script>
// Load Lucide và gọi createIcons ngay khi script sẵn sàng
(function() {
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js';
  s.onload = function() {
    if (typeof initApp === 'function') initApp();
    else window._lucideReady = true;
  };
  document.head.appendChild(s);
})();
</script>
<style>
:root {
  --bg: #0D0F1A;
  --surface: #161929;
  --card: #1E2440;
  --card-hover: #252C4E;
  --border: #2A3260;
  --accent: #F5C842;
  --accent2: #FF6B8A;
  --accent3: #6BFFB8;
  --text: #E8EAFF;
  --muted: #7B82A8;
  --correct: #4DFFC2;
  --wrong: #FF5577;
  --radius: 16px;
  --radius-sm: 10px;
}
[data-theme="light"] {
  --bg: #F4F5FB;
  --surface: #FFFFFF;
  --card: #ECEEF8;
  --card-hover: #E2E4F4;
  --border: #C8CCE8;
  --accent: #C9960A;
  --accent2: #E0395A;
  --accent3: #0B9E6E;
  --text: #1A1D35;
  --muted: #6B72A0;
  --correct: #0B9E6E;
  --wrong: #E0395A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 48px;
  background-image: radial-gradient(ellipse 80% 60% at 50% -20%, #1a1f4a 0%, transparent 70%);
  transition: background 0.3s, color 0.3s;
}
[data-theme="light"] body {
  background-image: radial-gradient(ellipse 80% 60% at 50% -20%, #dde0f8 0%, transparent 70%);
}

/* ══════════════════════════════
   COMPACT HEADER
══════════════════════════════ */
.app-header {
  background: linear-gradient(180deg, #12162a 0%, #0D0F1A 100%);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.header-title { flex: 1; }
.title-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  letter-spacing: 1px;
}
.title-sub {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: 1px;
}
.header-icons { display: flex; gap: 8px; align-items: center; }
.hdr-icon-btn {
  width: 38px; height: 38px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  border-radius: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  transition: all 0.2s;
  flex-shrink: 0;
}
.hdr-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.hdr-icon-btn.active { border-color: var(--accent); background: var(--card); color: var(--accent); }

/* ══════════════════════════════
   GAME ZONE  (panels + window)
══════════════════════════════ */
.game-zone {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px 0;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

/* Shared panel style */
.side-panel {
  flex-shrink: 0;
  width: 0;
  overflow: hidden;
  opacity: 0;
  transition: width 0.32s cubic-bezier(0.4,0,0.2,1), opacity 0.22s ease;
}
.side-panel.open { width: 222px; opacity: 1; }
.panel-inner {
  width: 222px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.panel-label {
  font-size: 0.62rem;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  padding: 0 4px 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}

/* ── Settings panel specific ── */
/* Script toggle gạt (pill) */
.script-gat {
  display: flex;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 3px;
  gap: 0;
}
.script-gat-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 6px 4px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.22s;
  text-align: center;
  line-height: 1.2;
}
.script-gat-btn.active { background: var(--accent); color: #0D0F1A; }

/* Cat buttons dọc */
.cat-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 1px;
  text-align: left;
  width: 100%;
}
.cat-btn .cat-main { font-size: 0.78rem; }
.cat-btn .cat-sub { font-size: 0.6rem; color: var(--muted); font-weight: 400; }
.cat-btn.active { border-color: var(--accent2); color: var(--accent2); background: #1E2440; }
.cat-btn.active .cat-sub { color: var(--accent2); opacity: 0.7; }

/* ── Game list panel specific ── */
.tab-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  white-space: nowrap;
}
.tab-btn:hover { background: var(--card); color: var(--text); }
.tab-btn.active { background: var(--card); border-color: var(--border); color: var(--accent); }

/* ══════════════════════════════
   KANA PICKER MODAL
══════════════════════════════ */
.kp-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 999;
  align-items: flex-end;
  justify-content: center;
}
.kp-overlay.open { display: flex; }
.kp-sheet {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 720px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.kp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.kp-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.kp-count { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.kp-close {
  width: 28px; height: 28px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.kp-close:hover { border-color: var(--wrong); color: var(--wrong); }
.kp-actions {
  display: flex;
  gap: 8px;
  padding: 10px 18px;
  flex-shrink: 0;
}
.kp-act-btn {
  flex: 1;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 600;
  padding: 6px 8px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.kp-act-btn:hover { border-color: var(--accent); color: var(--accent); }
.kp-cat-tabs {
  display: flex;
  gap: 6px;
  padding: 0 18px 10px;
  flex-shrink: 0;
}
.kp-cat-tab {
  flex: 1;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 600;
  padding: 6px 8px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.kp-cat-tab.active { border-color: var(--accent2); color: var(--accent2); background: #1E2440; }
.kp-grid-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 4px 18px 10px;
}
.kp-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}
.kp-cell {
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 8px 4px 6px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.kp-cell:hover { border-color: var(--accent); }
.kp-cell.on { border-color: var(--accent); background: #252C4E; }
.kp-cell.off { opacity: 0.3; }
.kp-cell .kp-kana { font-family: 'Noto Sans JP', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--accent); line-height: 1; }
.kp-cell.off .kp-kana { color: var(--muted); }
.kp-cell .kp-rom { font-size: 0.6rem; color: var(--muted); margin-top: 3px; }
.kp-cell.on .kp-rom { color: var(--accent); opacity: 0.7; }
.kp-footer {
  padding: 10px 18px 14px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
}
.kp-confirm {
  width: 100%;
  border: none;
  background: var(--accent);
  color: #0D0F1A;
  font-weight: 700;
  font-size: 0.9rem;
  padding: 13px;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.2s;
}
.kp-confirm:hover { background: #f0c030; }

/* Panel button mở kana picker */
.kp-open-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  width: 100%;
  margin-top: 4px;
}
.kp-open-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Lucide icons */
[data-lucide] { width: 18px; height: 18px; stroke-width: 2; vertical-align: middle; flex-shrink: 0; }
.hdr-icon-btn [data-lucide] { width: 17px; height: 17px; }
.tab-btn [data-lucide] { width: 15px; height: 15px; stroke: currentColor; }
.cat-btn [data-lucide] { width: 14px; height: 14px; stroke: currentColor; }
.game-window-header [data-lucide] { width: 15px; height: 15px; stroke: var(--accent); }
.lp-speak-btn [data-lucide] { width: 40px; height: 40px; stroke-width: 1.5; stroke: currentColor; }
.fc-controls [data-lucide] { width: 15px; height: 15px; stroke: currentColor; }
.btn-start [data-lucide] { width: 14px; height: 14px; stroke: currentColor; }

/* Game window */
.game-window {
  flex: 1;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  min-height: 420px;
}
.game-window-header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 9px 18px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.game-window-header .game-icon { font-size: 0.9rem; }
.game-window-header .game-name {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.3px;
}
.game-window-body { padding: 24px 20px; }

/* ─── FLASHCARD ─── */
#game-flashcard .card-scene {
  perspective: 1000px;
  cursor: pointer;
  user-select: none;
  height: 280px;
  margin-bottom: 20px;
}
.card-3d {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.card-3d.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.card-front { background: linear-gradient(135deg, var(--card) 0%, var(--card-hover) 100%); }
.card-back { background: linear-gradient(135deg, var(--surface) 0%, var(--card) 100%); transform: rotateY(180deg); }
.kana-big {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 7rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}
.card-hint { font-size: 0.82rem; color: var(--muted); margin-top: 14px; font-weight: 500; letter-spacing: 0.3px; }
.romaji-big { font-size: 3rem; font-weight: 700; color: var(--accent3); letter-spacing: 2px; }
.fc-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}
.fc-controls button {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.fc-controls button:hover { background: var(--card-hover); border-color: var(--accent); }
.fc-controls .btn-primary { background: var(--accent); color: #0D0F1A; border-color: var(--accent); }
.fc-controls .btn-primary:hover { background: #f0c030; }
.progress-text { color: var(--muted); font-size: 0.85rem; min-width: 70px; text-align: center; }

/* ─── GAME OVER SCREEN ─── */
.game-over {
  text-align: center;
  padding: 30px 20px;
}
.game-over-title {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 6px;
}
.game-over-sub {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 24px;
}
.game-over-stats {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-bottom: 28px;
}
.game-over-stat .stat-num { font-size: 2.2rem; font-weight: 900; }
.game-over-stat .stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.game-over-stat.ok .stat-num { color: var(--correct); }
.game-over-stat.bad .stat-num { color: var(--wrong); }
.game-over-stat.total .stat-num { color: var(--text); }

/* ─── QUIZ ─── */
#game-quiz .q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 18px;
}
.q-kana {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 6rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}
.q-prompt { color: var(--muted); font-size: 0.82rem; margin-top: 12px; }
.game-hint { color: var(--muted); font-size: 0.82rem; font-weight: 500; letter-spacing: 0.3px; text-align: center; margin-top: 10px; }
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.opt-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 2.3rem;
  font-weight: 700;
  padding: 18px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.opt-btn:hover:not(:disabled) { background: var(--card-hover); border-color: var(--accent); }
.opt-btn.correct { background: #1A3A30; border-color: var(--correct); color: var(--correct); }
.opt-btn.wrong { background: #3A1A20; border-color: var(--wrong); color: var(--wrong); }
.opt-btn:disabled { cursor: default; }
.quiz-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
.score-item { text-align: center; }
.score-num { font-size: 1.8rem; font-weight: 700; }
.score-label { font-size: 0.72rem; color: var(--muted); }
.score-correct .score-num { color: var(--correct); }
.score-wrong .score-num { color: var(--wrong); }
.feedback-msg { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 10px; font-weight: 600; }
.feedback-msg.ok { color: var(--correct); }
.feedback-msg.fail { color: var(--wrong); }

/* ─── TYPING ─── */
#game-typing .t-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 18px;
}
.t-kana {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 6rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 8px;
}
.t-input-wrap { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.t-input {
  flex: 1;
  min-width: 0;
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--text);
  font-size: 1.4rem;
  font-weight: 600;
  text-align: center;
  letter-spacing: 3px;
  padding: 14px;
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.2s;
  box-sizing: border-box;
  -webkit-appearance: none;
}
.t-input:focus { border-color: var(--accent); }
.t-input.correct { border-color: var(--correct); background: #1A3A30; color: #fff; }
.t-input.wrong { border-color: var(--wrong); background: #3A1A20; color: #fff; }

.t-submit {
  border: none;
  background: var(--accent);
  color: #0D0F1A;
  font-weight: 700;
  font-size: 0.9rem;
  padding: 11px 28px;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.2s;
}
.t-submit:hover { background: #f0c030; }
.t-feedback { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 12px; font-weight: 600; }
.t-feedback.ok { color: var(--correct); }
.t-feedback.fail { color: var(--wrong); }
.t-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 14px; }
.t-streak { color: var(--accent); font-size: 0.85rem; text-align: center; margin-bottom: 8px; }

/* ─── MATCHING ─── */
#game-matching .m-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.m-timer { font-size: 1.5rem; font-weight: 700; color: var(--accent); min-width: 60px; }
.m-stats { color: var(--muted); font-size: 0.82rem; }
.m-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  margin-bottom: 12px;
}
/* Matching tile — 5 cols, height cố định vừa viewport */
.m-tile {
  height: clamp(52px, 9vh, 80px);
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.18s;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  position: relative;
  overflow: hidden;
  user-select: none;
}
.m-tile:hover:not(.matched):not(.selected) { background: var(--card-hover); border-color: var(--accent); transform: scale(1.04); }
.m-tile.selected { border-color: var(--accent); background: #252C55; box-shadow: 0 0 0 2px var(--accent); color: #fff; }
.m-tile.matched { border-color: var(--correct); background: #1A3A30; color: var(--correct); cursor: default; }
.m-tile.wrong-flash { border-color: var(--wrong); background: #3A1A20; animation: wrongShake 0.35s; }
/* kana tile: big kana, no sub-text */
.m-tile.type-kana .tile-kana {
  font-size: 2.2rem;
  color: var(--accent);
  line-height: 1;
}
.m-tile.matched.type-kana .tile-kana { color: var(--correct); }
/* romaji tile: big romaji text */
.m-tile.type-rom .tile-rom {
  font-size: 2.3rem;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}
.m-tile.matched.type-rom .tile-rom { color: var(--correct); }
.m-tile.selected .tile-rom { color: #fff; }
.m-size-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.m-size-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 0.78rem;
  padding: 6px 16px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.m-size-btn.active { border-color: var(--accent2); color: var(--accent2); background: var(--card); }
@keyframes wrongShake {
  0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}
}
/* Buttons */
.btn-start {
  border: none;
  background: var(--accent);
  color: #0D0F1A;
  font-weight: 700;
  font-size: 0.88rem;
  padding: 11px 22px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-start:hover { background: #f0c030; }
.btn-start-green {
  background: #22c55e !important;
  color: #fff !important;
  border: none !important;
}
.btn-start-green:hover { background: #16a34a !important; }
/* Progress bar */
.prog-bar-wrap {
  background: var(--card);
  border-radius: 50px;
  height: 4px;
  margin-bottom: 16px;
  overflow: hidden;
}
.prog-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 50px;
  transition: width 0.3s;
}
/* ─── SPEED RECOGNITION ─── */
#game-speed .sr-display {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.sr-kana {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 7rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  transition: opacity 0.1s;
}
.sr-kana.hide { opacity: 0; }
.sr-timer-ring {
  position: absolute;
  top: 10px; right: 14px;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--accent);
  transition: color 0.2s;
  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}
.sr-timer-ring.urgent { color: var(--wrong); }
.sr-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.sr-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 14px; }
.sr-feedback { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 10px; font-weight: 600; }
.sr-feedback.ok { color: var(--correct); }
.sr-feedback.fail { color: var(--wrong); }
.sr-speed-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.sr-speed-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 0.78rem;
  padding: 6px 16px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.sr-speed-btn.active { border-color: var(--accent2); color: var(--accent2); background: var(--card); }

/* ─── LISTEN & PICK ─── */
#game-listen .lp-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 16px;
}
.lp-speak-btn {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: var(--surface);
  color: var(--accent);
  font-size: 3rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
}
.lp-speak-btn:hover { background: var(--card); transform: scale(1.05); }
.lp-speak-btn.speaking { background: var(--accent); color: #0D0F1A; animation: pulse 0.6s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
.lp-hint { color: var(--muted); font-size: 0.82rem; }
.lp-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.lp-opt {
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--accent);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lp-opt:hover:not(:disabled) { background: var(--card-hover); border-color: var(--accent); transform: scale(1.04); }
.lp-opt.correct { background: #1A3A30; border-color: var(--correct); color: var(--correct); }
.lp-opt.wrong { background: #3A1A20; border-color: var(--wrong); color: var(--wrong); }
.lp-opt:disabled { cursor: default; transform: none; }
.lp-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 14px; }
.lp-feedback { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 10px; font-weight: 600; }
.lp-feedback.ok { color: var(--correct); }
.lp-feedback.fail { color: var(--wrong); }

/* responsive */
/* Typing — ẩn score/streak khi focus input */
/* keyboard-open: không ẩn gì cả */

@media(max-width:600px){
  .kana-big,.q-kana,.t-kana { font-size: 4.5rem; }

  .m-tile.type-rom .tile-rom { font-size: 1.5rem; }
  .quiz-options { gap: 8px; }
  .opt-btn { padding: 14px 6px; font-size: 1.6rem; }

  /* Game zone: bỏ padding để game-window chiếm full width */
  .game-zone { padding: 10px 10px 0; gap: 0; }

  /* Panel overlay phủ lên trên thay vì đẩy game-window hẹp lại */
  .side-panel {
    position: absolute;
    z-index: 100;
    left: 10px;
    top: 0;
    width: 0;
    opacity: 0;
  }
  .side-panel.open { width: 222px; opacity: 1; }

  /* game-zone cần position relative để panel absolute hoạt động */
  .game-zone { position: relative; }

  /* game-window chiếm toàn bộ width */
  .game-window { width: 100%; }

  .game-window-body { padding: 18px 14px; }
}
</style>

let currentScript = 'hiragana';
let currentGame = 'flashcard';
let activeCategories = ['basic'];
let gameRoundLimit = 10; // null = unlimited
let srDisplayTime = 3; // giây hiển thị chữ trong Speed Rec

// selectedKana[script][cat] = Set of romaji strings được chọn
// null = chọn tất cả (mặc định)
const selectedKana = { hiragana: {}, katakana: {} };

function getSelectedSet(script, cat) {
  return selectedKana[script][cat] || null; // null = all selected
}

function isKanaSelected(script, cat, rom) {
  const s = selectedKana[script][cat];
  return !s || s.has(rom);
}

function getPool() {
  let pool = [];
  activeCategories.forEach(c => {
    const all = DATA[currentScript][c];
    const sel = selectedKana[currentScript][c];
    pool = pool.concat(sel ? all.filter(([,r]) => sel.has(r)) : all);
  });
  return pool;
}

function getTotalSelected() {
  let n = 0;
  activeCategories.forEach(c => {
    const all = DATA[currentScript][c];
    const sel = selectedKana[currentScript][c];
    n += sel ? sel.size : all.length;
  });
  return n;
}

function getTotalPool() {
  let n = 0;
  activeCategories.forEach(c => { n += DATA[currentScript][c].length; });
  return n;
}

// Set script (hiragana / katakana)
function setScript(s) {
  currentScript = s;
  document.getElementById('btn-hira').classList.toggle('active', s==='hiragana');
  document.getElementById('btn-kata').classList.toggle('active', s==='katakana');
  updateHeaderSub();
  resetCurrentGame();
}

// Toggle category
function toggleCat(c) {
  if (activeCategories.includes(c)) {
    if (activeCategories.length === 1) return;
    activeCategories = activeCategories.filter(x => x !== c);
  } else {
    activeCategories.push(c);
  }
  document.getElementById('cat-basic').classList.toggle('active', activeCategories.includes('basic'));
  document.getElementById('cat-dakuten').classList.toggle('active', activeCategories.includes('dakuten'));
  document.getElementById('cat-combo').classList.toggle('active', activeCategories.includes('combo'));
  updateHeaderSub();
  resetCurrentGame();
}

// Panel toggle (settings | games) — chỉ 1 panel mở tại 1 thời điểm
let openPanel = null;
function togglePanel(name) {
  const isSame = openPanel === name;
  // Đóng tất cả
  ['settings','games'].forEach(p => {
    document.getElementById('panel-'+p).classList.remove('open');
    document.getElementById('btn-panel-'+p).classList.remove('active');
  });
  if (!isSame) {
    document.getElementById('panel-'+name).classList.add('open');
    document.getElementById('btn-panel-'+name).classList.add('active');
    openPanel = name;
  } else {
    openPanel = null;
  }
}

function updateHeaderSub() {
  const script = currentScript === 'hiragana' ? 'ひらがな' : 'カタカナ';
  const cats = activeCategories.map(c => c === 'basic' ? 'Basic' : c === 'dakuten' ? 'Dakuten' : 'Combo').join(' · ');
  const sel = getTotalSelected();
  const total = getTotalPool();
  const countStr = sel < total ? ` · ${sel}/${total} chữ` : '';
  document.getElementById('header-sub').textContent = script + ' · ' + cats + countStr;
  // Cập nhật label button trong panel
  const lbl = document.getElementById('kp-panel-label');
  if (lbl) lbl.textContent = sel < total ? `Đang ôn ${sel}/${total} chữ` : 'Chọn chữ ôn tập';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function randItems(arr, n) { return shuffle(arr).slice(0, Math.min(n, arr.length)); }

let qPool = [], qIndex = 0, qCorrect = 0, qWrong = 0, qAnswered = false;

let qReverse = false;
function toggleQuizReverse() {
  qReverse = !qReverse;
  const btn = document.getElementById('q-reverse-btn');
  if (btn) { btn.style.borderColor = qReverse ? 'var(--accent2)' : ''; btn.style.color = qReverse ? 'var(--accent2)' : ''; }
  startQuiz();
}
function startQuiz() {
  const pool = shuffle(getPool());
  qPool = gameRoundLimit ? pool.slice(0, gameRoundLimit) : pool;
  qIndex = 0; qCorrect = 0; qWrong = 0; qAnswered = false;
  updateQScore(); renderQuestion();
}

function renderQuestion() {
  if (qIndex >= qPool.length) { showGameOver('quiz', qCorrect, qWrong); return; }
  const pool = getPool();
  const [kana, correct] = qPool[qIndex];
  const kanaEl = document.getElementById('q-kana');
  const prompt = document.getElementById('q-prompt');
  document.getElementById('q-feedback').textContent = '';
  document.getElementById('q-feedback').className = 'feedback-msg';

  const wrap = document.getElementById('quiz-options');
  wrap.innerHTML = '';

  if (qReverse) {
    // Hiện romaji → chọn kana
    kanaEl.textContent = correct;
    kanaEl.style.fontFamily = "Inter, sans-serif";
    kanaEl.style.fontSize = '3.5rem';
    kanaEl.style.letterSpacing = '3px';
    if (prompt) prompt.textContent = 'Chọn kana đúng';
    let wrongs = pool.filter(x => x[0] !== kana);
    wrongs = shuffle(wrongs).slice(0,3).map(x=>x[0]);
    const opts = shuffle([kana, ...wrongs]);
    opts.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.style.fontFamily = "'Noto Sans JP', sans-serif";
      b.style.fontSize = '1.8rem';
      b.textContent = opt;
      b.onclick = () => selectAnswer(b, opt, kana);
      wrap.appendChild(b);
    });
  } else {
    // Hiện kana → chọn romaji
    kanaEl.textContent = kana;
    kanaEl.style.fontFamily = '';
    kanaEl.style.fontSize = '';
    kanaEl.style.letterSpacing = '';
    if (prompt) prompt.textContent = 'Chọn romaji đúng';
    let wrongs = pool.filter(x => x[1] !== correct);
    wrongs = shuffle(wrongs).slice(0,3).map(x=>x[1]);
    const opts = shuffle([correct, ...wrongs]);
    opts.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt;
      b.onclick = () => selectAnswer(b, opt, correct);
      wrap.appendChild(b);
    });
  }
  qAnswered = false;
  document.getElementById('q-prog').style.width = Math.min(100,((qCorrect+qWrong)/(qPool.length||1))*100)+'%';
}

function selectAnswer(btn, chosen, correct) {
  if (qAnswered) return;
  qAnswered = true;
  const fb = document.getElementById('q-feedback');
  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = '✓ Chính xác!'; fb.className = 'feedback-msg ok'; qCorrect++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ Sai — đáp án: ' + correct; fb.className = 'feedback-msg fail'; qWrong++;
    document.querySelectorAll('.opt-btn').forEach(b => { if (b.textContent===correct) b.classList.add('correct'); });
  }
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  updateQScore(); qIndex++;
  setTimeout(renderQuestion, 1000);
}

function updateQScore() {
  document.getElementById('q-correct').textContent = qCorrect;
  document.getElementById('q-wrong').textContent = qWrong;
  document.getElementById('q-total').textContent = qCorrect+qWrong;
}

  tIndex = 0; tCorrect = 0; tWrong = 0; tStreak = 0;
  updateTScore(); renderTyping();

function renderTyping() {
  if (tIndex >= tPool.length) { showGameOver('typing', tCorrect, tWrong); return; }
  const [kana, rom] = tPool[tIndex];
  const display = tReverse ? rom : kana;

  document.getElementById('t-prog').style.width = Math.min(100, ((tCorrect+tWrong)/(tPool.length||1))*100)+'%';
  updateStreakDisplay();
}

function handleTypingKey(e) { if (e.key==='Enter') checkTyping(); }

// Ẩn score/streak khi bàn phím ảo hiện lên (mobile)
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('t-input');
  if (!inp) return;
  inp.addEventListener('focus', () => {
    document.getElementById('game-typing').classList.add('keyboard-open');
  });
  inp.addEventListener('blur', () => {
    document.getElementById('game-typing').classList.remove('keyboard-open');
  });
});

function checkTyping() {
  const inp = document.getElementById('t-input');
  const answer = inp.value.trim();
  const [kana, rom] = tPool[tIndex];
  const correct = tReverse ? kana : rom;
  const checkAnswer = tReverse ? answer : answer.toLowerCase();
  const fb = document.getElementById('t-feedback');
  if (!answer) { inp.focus(); return; }
  if (correct.split('/').includes(checkAnswer)) {
    inp.className = 't-input correct';
    fb.textContent = '✓ Chính xác!'; fb.className = 't-feedback ok';
    tCorrect++; tStreak++;
    updateTScore(); tIndex++;
    setTimeout(renderTyping, 700);
  } else {
    inp.className = 't-input wrong';
    fb.textContent = '✗ Đáp án: ' + correct; fb.className = 't-feedback fail';
    tWrong++; tStreak = 0;
    updateTScore(); tIndex++;
    setTimeout(renderTyping, 900);
  }
}

function skipTyping() { tStreak = 0; tIndex++; renderTyping(); }

function updateTScore() {
  document.getElementById('t-correct').textContent = tCorrect;

    const fire = tStreak >= 5 ? '🔥🔥🔥' : tStreak >= 4 ? '🔥🔥' : '🔥';

let matchSize = 10, matchTiles = [], matchSelected = null, matchPairs = 0, matchMoves = 0;
let matchTimer = 0, matchInterval = null, matchDone = false;

function setMatchSize(n) {
  matchSize = n;
  document.querySelectorAll('.m-size-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === n + ' cặp từ');
  });
  resetMatching();
}

function resetMatching() {
  // Dừng timer cũ, setup lưới, chờ Start
  clearInterval(matchInterval);
  matchTimer = 0; matchPairs = 0; matchMoves = 0; matchSelected = null; matchDone = false;
  document.getElementById('m-result-msg').textContent = '';
  document.getElementById('m-total-pairs').textContent = matchSize;
  document.getElementById('m-timer').textContent = '0:00';

  const pool = randItems(getPool(), matchSize);
  matchTiles = [];
  pool.forEach((pair, i) => {
    matchTiles.push({ id: i*2,   pairId: i, type: 'kana', display: pair[0], matched: false });
    matchTiles.push({ id: i*2+1, pairId: i, type: 'rom',  display: pair[1], matched: false });
  });
  matchTiles = shuffle(matchTiles);
  // Render grid nhưng disable click
  renderMatchGrid(true);
  updateMatchStats();

  // Hiện Start, ẩn nếu đang chờ
  const sb = document.getElementById('m-start-btn');
  if (sb) { sb.style.display = ''; }
}

function doStartMatching() {
  const sb = document.getElementById('m-start-btn');
  if (sb) sb.style.display = 'none';
  // Enable click trên tiles
  renderMatchGrid(false);
  matchInterval = setInterval(() => { if (!matchDone) { matchTimer++; updateMatchTimer(); } }, 1000);
}

// Alias cho resetCurrentGame
function startMatching() { resetMatching(); }

function renderMatchGrid(disabled) {
  const grid = document.getElementById('m-grid');
  grid.style.gridTemplateColumns = '';
  grid.innerHTML = '';
  matchTiles.forEach(tile => {
    const el = document.createElement('div');
    el.className = 'm-tile type-' + tile.type + (tile.matched ? ' matched' : '');
    el.dataset.id = tile.id;
    if (disabled) {
      // Chưa Start: hiện "?" cho tất cả
      el.innerHTML = `<span class="tile-kana" style="color:var(--muted)">?</span>`;
    } else if (tile.type === 'kana') {
      el.innerHTML = `<span class="tile-kana">${tile.display}</span>`;
    } else {
      el.innerHTML = `<span class="tile-rom">${tile.display}</span>`;
    }
    if (!tile.matched && !disabled) el.onclick = () => selectMatchTile(tile.id);
    grid.appendChild(el);
  });
}

function selectMatchTile(id) {
  if (matchDone) return;
  const tile = matchTiles.find(t => t.id===id);
  if (!tile || tile.matched) return;
  const el = document.querySelector(`.m-tile[data-id="${id}"]`);

  if (matchSelected === null) {
    matchSelected = id; el.classList.add('selected'); return;
  }
  if (matchSelected === id) {
    el.classList.remove('selected'); matchSelected = null; return;
  }

  const prev = matchTiles.find(t => t.id===matchSelected);
  const prevEl = document.querySelector(`.m-tile[data-id="${matchSelected}"]`);
  matchMoves++;

  if (prev.pairId === tile.pairId) {
    prev.matched = true; tile.matched = true;
    prevEl.classList.remove('selected'); prevEl.classList.add('matched');
    el.classList.add('matched');
    matchPairs++; matchSelected = null;
    updateMatchStats();
    if (matchPairs === matchSize) {
      matchDone = true; clearInterval(matchInterval);
      const m = Math.floor(matchTimer/60), s = matchTimer%60;
      document.getElementById('m-result-msg').innerHTML = `🎉 Hoàn thành trong ${m}:${String(s).padStart(2,'0')} với ${matchMoves} lượt chọn!`;
    }
  } else {
    el.classList.add('wrong-flash'); prevEl.classList.add('wrong-flash');
    matchSelected = null;
    setTimeout(() => {
      el.classList.remove('wrong-flash','selected');
      prevEl.classList.remove('wrong-flash','selected');
    }, 400);
  }
  updateMatchStats();
}

function updateMatchTimer() {
  const m = Math.floor(matchTimer/60), s = matchTimer%60;
  document.getElementById('m-timer').textContent = m+':'+String(s).padStart(2,'0');
}
function updateMatchStats() {
  document.getElementById('m-pairs').textContent = matchPairs;
  document.getElementById('m-moves').textContent = matchMoves;
}

function doStartSpeed() {
  const sb = document.getElementById('sr-start-btn');
  if (sb) sb.style.display = 'none';
  const pool = shuffle(getPool());
  srPool = gameRoundLimit ? pool.slice(0, gameRoundLimit) : pool;
  srIndex=0; srCorrect=0; srWrong=0; srAnswered=false;
  updateSRScore(); renderSpeed();
}

// Alias
function startSpeed() { resetSpeed(); }

function renderSpeed() {
  if (srIndex >= srPool.length) { showGameOver('speed', srCorrect, srWrong); return; }
  clearInterval(srCountdown);
  srAnswered = false;

  const pool = getPool();
  const [kana, correct] = srPool[srIndex];
  const kanaEl = document.getElementById('sr-kana');
  const timerEl = document.getElementById('sr-timer');
  const fb = document.getElementById('sr-feedback');

  kanaEl.className = 'sr-kana';
  fb.textContent = ''; fb.className = 'sr-feedback';

  if (srReverse) {
    // Đảo: hiện romaji, chọn kana
    kanaEl.textContent = correct;
    kanaEl.style.fontFamily = "Inter, sans-serif";
    kanaEl.style.fontSize = '3.5rem';
    kanaEl.style.letterSpacing = '2px';
    let wrongs = pool.filter(x => x[0] !== kana);
    wrongs = shuffle(wrongs).slice(0,3).map(x=>x[0]);
    const opts = shuffle([kana, ...wrongs]);
    const wrap = document.getElementById('sr-options');
    wrap.innerHTML = '';
    opts.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.style.fontFamily = "'Noto Sans JP', sans-serif";
      b.style.fontSize = '1.6rem';
      b.textContent = opt;
      b.onclick = () => srSelect(b, opt, kana);
      wrap.appendChild(b);
    });
  } else {
    // Bình thường: hiện kana, chọn romaji
    kanaEl.textContent = kana;
    kanaEl.style.fontFamily = '';
    kanaEl.style.fontSize = '';
    kanaEl.style.letterSpacing = '';
    let wrongs = pool.filter(x => x[1] !== correct);
    wrongs = shuffle(wrongs).slice(0,3).map(x=>x[1]);
    const opts = shuffle([correct, ...wrongs]);
    const wrap = document.getElementById('sr-options');
    wrap.innerHTML = '';
    opts.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'opt-btn'; b.textContent = opt;
      b.onclick = () => srSelect(b, opt, correct);
      wrap.appendChild(b);
    });
  }

  // Countdown — dùng timestamp để chính xác
  srTimeLeft = srSpeed;
  timerEl.textContent = srTimeLeft;
  timerEl.className = 'sr-timer-ring';
  document.getElementById('sr-prog').style.width = Math.min(100,((srCorrect+srWrong)/(srPool.length||1))*100)+'%';

  const startTime = Date.now();
  const totalMs = srSpeed * 1000;
  const displayMs = Math.min(srDisplayTime, srSpeed) * 1000;
  let hintHidden = false;

  srCountdown = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const remaining = Math.ceil((totalMs - elapsed) / 1000);

    // Ẩn chữ gợi ý sau đúng srDisplayTime giây
    if (!hintHidden && elapsed >= displayMs) {
      hintHidden = true;
      kanaEl.classList.add('hide');
    }

    // Cập nhật đồng hồ
    if (remaining !== srTimeLeft) {
      srTimeLeft = remaining;
      timerEl.textContent = Math.max(0, srTimeLeft);
      if (srTimeLeft <= 1) timerEl.className = 'sr-timer-ring urgent';
    }

    // Hết giờ
    if (elapsed >= totalMs) {
      clearInterval(srCountdown);
      if (!srAnswered) {
        srAnswered = true;
        srWrong++;
        fb.textContent = '⏱ Hết giờ! — ' + correct; fb.className = 'sr-feedback fail';
        document.querySelectorAll('#sr-options .opt-btn').forEach(b => {
          if (b.textContent===correct) b.classList.add('correct');
          b.disabled = true;
        });
        updateSRScore();
        srIndex++;
        setTimeout(renderSpeed, 1000);
      }
    }
  }, 100); // tick 100ms để mượt và chính xác hơn
}

function srSelect(btn, chosen, correct) {
  if (srAnswered) return;
  srAnswered = true;
  clearInterval(srCountdown);
  document.getElementById('sr-kana').classList.remove('hide');
  const fb = document.getElementById('sr-feedback');
  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = '✓ Chính xác!'; fb.className = 'sr-feedback ok'; srCorrect++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ Sai — ' + correct; fb.className = 'sr-feedback fail'; srWrong++;
    document.querySelectorAll('#sr-options .opt-btn').forEach(b => { if(b.textContent===correct) b.classList.add('correct'); });
  }
  document.querySelectorAll('#sr-options .opt-btn').forEach(b => b.disabled=true);
  updateSRScore(); srIndex++;
  setTimeout(renderSpeed, 900);
}

function updateSRScore() {
  document.getElementById('sr-correct').textContent = srCorrect;
  document.getElementById('sr-wrong').textContent = srWrong;
  document.getElementById('sr-total').textContent = srCorrect+srWrong;
}

// ═══════════════════════════════════════════
// LISTEN & PICK
// ═══════════════════════════════════════════
let lpPool=[], lpIndex=0, lpCorrect=0, lpWrong=0, lpAnswered=false;
let lpCurrentKanas=[], lpCurrentRom='', lpRepeatCount=1;
let lpRate=0.4, lpPitch=1.1, lpSelectedVoice='', lpGap=1.0, lpVoiceGender='female';

function lpPickVoice(gender) {
  if (!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('ja'));
  if (!voices.length) return null;
  // Keyword-based: iOS có Kyoko (female), Otoya (male)
  // Android/Chrome: Google 日本語 thường chỉ có 1 giọng
  // → sắp xếp: giọng khớp keyword ưu tiên, còn lại dùng index 0 (female) hoặc cuối (male)
  const femaleKw = /kyoko|haruka|female|woman|otome|hanako|yui|nazomi|mizuki/i;
  const maleKw   = /otoya|keita|male|man|taro|ichiro|osamu/i;
  if (gender === 'female') {
    return voices.find(v => femaleKw.test(v.name)) || voices[0];
  } else {
    return voices.find(v => maleKw.test(v.name))
      || (voices.length > 1 ? voices[voices.length - 1] : null);
  }
}

function lpSetVoiceGender(gender) {
  lpVoiceGender = gender;
  lpSelectedVoice = ''; // reset, lpSpeak sẽ pick lại
}

function startListen() {
  lpPool = shuffle(getPool());
  lpIndex=0; lpCorrect=0; lpWrong=0; lpAnswered=false;
  updateLPScore(); renderListen();
}

// readList theo thu tu da doc, lpPickStep: so card da chon dung
let lpReadList=[], lpPickStep=0, lpPickExpected=[];

function renderListen() {
  if (lpIndex >= lpPool.length) { lpPool = shuffle(getPool()); lpIndex=0; }
  lpAnswered = false;
  lpPickStep = 0;
  const pool = getPool();

  // Lay lpRepeatCount chu tu pool
  const mainPair = lpPool[lpIndex];
  const extras = shuffle(pool.filter(x => x[1] !== mainPair[1])).slice(0, lpRepeatCount - 1);
  lpReadList = shuffle([mainPair, ...extras]);
  lpCurrentKanas = lpReadList.map(x => x[0]);
  lpPickExpected = lpReadList.map(x => x[1]);

  document.getElementById('lp-feedback').textContent = '';
  document.getElementById('lp-feedback').className = 'lp-feedback';
  document.getElementById('lp-speak-btn').className = 'lp-speak-btn';
  document.getElementById('lp-prog').style.width = Math.min(100,((lpCorrect+lpWrong)/(lpPool.length||1))*100)+'%';

  const hintEl = document.getElementById('lp-hint');
  if (lpRepeatCount === 1) {
    hintEl.textContent = 'Nhan de nghe — chon kana dung ben duoi';
  } else {
    hintEl.textContent = 'Nghe ' + lpRepeatCount + ' chữ — chọn lần lượt theo thứ tự đã nghe';
  }

  // Build options: kana trong readList + nhieu
  const readRoms = new Set(lpReadList.map(x => x[1]));
  let wrongs = pool.filter(x => !readRoms.has(x[1]));
  wrongs = shuffle(wrongs).slice(0, 8 - lpRepeatCount);
  const opts = shuffle([...lpReadList.map(x=>[x[0],x[1]]), ...wrongs.map(x=>[x[0],x[1]])]).slice(0, 8);

  const wrap = document.getElementById('lp-options');
  wrap.innerHTML = '';
  opts.forEach(([k, rom]) => {
    const b = document.createElement('button');
    b.className = 'lp-opt';
    b.textContent = k;
    b.dataset.rom = rom;
    b.onclick = () => lpSelect(b, rom);
    wrap.appendChild(b);
  });

}

// AudioContext singleton — unlock iOS audio session (ép dùng media speaker)
let _lpAudioCtx = null;
function lpUnlockAudio() {
  if (_lpAudioCtx) return Promise.resolve();
  try {
    _lpAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Phát 1 buffer im lặng rất ngắn để kích hoạt audio session
    const buf = _lpAudioCtx.createBuffer(1, 1, 22050);
    const src = _lpAudioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(_lpAudioCtx.destination);
    src.start(0);
    return _lpAudioCtx.resume();
  } catch(e) { return Promise.resolve(); }
}

function lpSpeak() {
  if (!window.speechSynthesis) return;
  const btn = document.getElementById('lp-speak-btn');
  btn.className = 'lp-speak-btn speaking';

  // Unlock audio session trước, sau đó mới speak
  lpUnlockAudio().then(() => {
    speechSynthesis.cancel();
    let i = 0;
    const chosenVoice = lpPickVoice(lpVoiceGender);

    function speakNext() {
      if (i >= lpCurrentKanas.length) { btn.className = 'lp-speak-btn'; return; }
      const utter = new SpeechSynthesisUtterance(lpCurrentKanas[i]);
      utter.lang = 'ja-JP'; utter.rate = lpRate; utter.pitch = lpPitch;
      if (chosenVoice) utter.voice = chosenVoice;
      utter.onend = () => { i++; if (i < lpCurrentKanas.length) setTimeout(speakNext, lpGap * 1000); else btn.className = 'lp-speak-btn'; };
      utter.onerror = () => { btn.className = 'lp-speak-btn'; };
      speechSynthesis.speak(utter);
    }
    speakNext();
  });
}

function lpSelect(btn, chosen) {
  if (lpAnswered) return;
  const fb = document.getElementById('lp-feedback');
  const expected = lpPickExpected[lpPickStep];

  if (chosen === expected) {
    btn.classList.add('correct');
    btn.disabled = true;
    lpPickStep++;

    if (lpPickStep < lpRepeatCount) {
      fb.textContent = '✓ ' + lpPickStep + '/' + lpRepeatCount + ' — tiep tuc chon';
      fb.className = 'lp-feedback ok';
    } else {
      lpAnswered = true;
      fb.textContent = '✓ Chính xác!'; fb.className = 'lp-feedback ok';
      lpCorrect++;
      document.querySelectorAll('#lp-options .lp-opt').forEach(b => b.disabled = true);
      updateLPScore(); lpIndex++;
      setTimeout(renderListen, 1000);
    }
  } else {
    lpAnswered = true;
    btn.classList.add('wrong');
    const orderStr = lpReadList.map(x => x[0]).join(' → ');
    fb.textContent = '✗ Sai — thu tu dung: ' + orderStr;
    fb.className = 'lp-feedback fail';
    lpWrong++;
    const remainRoms = new Set(lpPickExpected.slice(lpPickStep));
    document.querySelectorAll('#lp-options .lp-opt').forEach(b => {
      if (remainRoms.has(b.dataset.rom) && !b.classList.contains('correct')) b.classList.add('correct');
      b.disabled = true;
    });
    updateLPScore(); lpIndex++;
    setTimeout(renderListen, 1600);
  }
}

function updateLPScore() {
  document.getElementById('lp-correct').textContent = lpCorrect;
  document.getElementById('lp-wrong').textContent = lpWrong;
  document.getElementById('lp-total').textContent = lpCorrect+lpWrong;
}

// ═══════════════════════════════════════════
// HARD REFRESH
// ═══════════════════════════════════════════
function hardRefresh() {
  const url = new URL(window.location.href);
  url.searchParams.set('v', Date.now());
  window.location.replace(url.toString());
}

// ═══════════════════════════════════════════
// THEME TOGGLE
// ═══════════════════════════════════════════
let currentTheme = 'dark';
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  const html = document.documentElement;
  if (currentTheme === 'light') {
    html.setAttribute('data-theme', 'light');
  } else {
    html.removeAttribute('data-theme');
  }
  // Đổi icon
  const iconEl = document.querySelector('#btn-theme [data-lucide]');
  if (iconEl) {
    iconEl.setAttribute('data-lucide', currentTheme === 'light' ? 'moon' : 'sun');
    lucide.createIcons({ nodes: [iconEl] });
  }
}

// ═══════════════════════════════════════════
// KANA PICKER
// ═══════════════════════════════════════════
let kpCurrentCat = 'basic'; // tab đang xem trong modal
// draft: thay đổi tạm trong modal, chỉ apply khi bấm Áp dụng
let kpDraft = {}; // {script: {cat: Set | null}}

function openKanaPicker() {
  // Clone selectedKana vào draft
  kpDraft = { hiragana: {}, katakana: {} };
  ['hiragana','katakana'].forEach(s => {
    ['basic','dakuten','combo'].forEach(c => {
      const src = selectedKana[s][c];
      kpDraft[s][c] = src ? new Set(src) : null;
    });
  });
  // Mở tab đầu tiên của activeCategories
  kpCurrentCat = activeCategories[0] || 'basic';
  renderKpCatTabs();
  renderKpGrid();
  document.getElementById('kp-overlay').classList.add('open');
  lucide.createIcons();
}

function closeKanaPicker() {
  document.getElementById('kp-overlay').classList.remove('open');
}

function kpOverlayClick(e) {
  if (e.target === document.getElementById('kp-overlay')) closeKanaPicker();
}

function renderKpCatTabs() {
  const wrap = document.getElementById('kp-cat-tabs');
  wrap.innerHTML = '';
  const cats = ['basic','dakuten','combo'];
  const labels = { basic: 'Basic', dakuten: 'Dakuten', combo: 'Combo' };
  cats.forEach(c => {
    const all = DATA[currentScript][c];
    const draft = kpDraft[currentScript][c];
    const selCount = draft ? draft.size : all.length;
    const btn = document.createElement('button');
    btn.className = 'kp-cat-tab' + (c === kpCurrentCat ? ' active' : '');
    btn.textContent = `${labels[c]} (${selCount}/${all.length})`;
    btn.onclick = () => { kpCurrentCat = c; renderKpCatTabs(); renderKpGrid(); };
    wrap.appendChild(btn);
  });
}

function renderKpGrid() {
  const grid = document.getElementById('kp-grid');
  grid.innerHTML = '';
  const all = DATA[currentScript][kpCurrentCat];
  const draft = kpDraft[currentScript][kpCurrentCat];
  let selCount = 0;

  all.forEach(([kana, rom]) => {
    const on = !draft || draft.has(rom);
    if (on) selCount++;
    const cell = document.createElement('div');
    cell.className = 'kp-cell ' + (on ? 'on' : 'off');
    cell.innerHTML = `<div class="kp-kana">${kana}</div><div class="kp-rom">${rom}</div>`;
    cell.onclick = () => kpToggleCell(rom, cell, all);
    grid.appendChild(cell);
  });

  updateKpCount();
}

function kpToggleCell(rom, cell, all) {
  let draft = kpDraft[currentScript][kpCurrentCat];
  // null = all selected → expand to full Set trước khi bỏ
  if (!draft) {
    draft = new Set(all.map(x => x[1]));
    kpDraft[currentScript][kpCurrentCat] = draft;
  }
  if (draft.has(rom)) {
    if (draft.size <= 1) return; // giữ ít nhất 1 chữ
    draft.delete(rom);
    cell.className = 'kp-cell off';
  } else {
    draft.add(rom);
    cell.className = 'kp-cell on';
    // Nếu chọn lại hết thì đặt về null
    if (draft.size === all.length) kpDraft[currentScript][kpCurrentCat] = null;
  }
  renderKpCatTabs();
  updateKpCount();
}

function kpSelectAll() {
  kpDraft[currentScript][kpCurrentCat] = null; // null = all
  renderKpGrid(); renderKpCatTabs();
}

function kpDeselectAll() {
  const all = DATA[currentScript][kpCurrentCat];
  // Giữ lại 1 chữ đầu
  kpDraft[currentScript][kpCurrentCat] = new Set([all[0][1]]);
  renderKpGrid(); renderKpCatTabs();
}

function kpInvert() {
  const all = DATA[currentScript][kpCurrentCat];
  const draft = kpDraft[currentScript][kpCurrentCat];
  const currentSet = draft ? draft : new Set(all.map(x => x[1]));
  const inverted = new Set(all.map(x => x[1]).filter(r => !currentSet.has(r)));
  if (inverted.size === 0) inverted.add(all[0][1]); // giữ ít nhất 1
  kpDraft[currentScript][kpCurrentCat] = inverted.size === all.length ? null : inverted;
  renderKpGrid(); renderKpCatTabs();
}

function updateKpCount() {
  let total = 0, sel = 0;
  ['basic','dakuten','combo'].forEach(c => {
    const all = DATA[currentScript][c];
    const draft = kpDraft[currentScript][c];
    total += all.length;
    sel += draft ? draft.size : all.length;
  });
  document.getElementById('kp-count').textContent = `${sel} / ${total} đang được chọn`;
  document.getElementById('kp-confirm').textContent = 'Áp dụng';
}

function applyKanaPicker() {
  // Copy draft vào selectedKana
  ['basic','dakuten','combo'].forEach(c => {
    const d = kpDraft[currentScript][c];
    selectedKana[currentScript][c] = d ? new Set(d) : null;
  });
  closeKanaPicker();
  updateHeaderSub();
  resetCurrentGame();
}

// ═══════════════════════════════════════════
// GAME OVER
// ═══════════════════════════════════════════
function showGameOver(gameId, correct, wrong) {
  const total = correct + wrong;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  // Dùng overlay phủ lên game window, không xóa HTML game
  let overlay = document.getElementById('gameover-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'gameover-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.72);padding:20px';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 32px;max-width:360px;width:100%;text-align:center">
      <div style="font-size:2rem;margin-bottom:6px">🎉</div>
      <div class="game-over-title">Hoàn tất!</div>
      <div class="game-over-sub">Bạn đã hoàn thành ${total} câu</div>
      <div class="game-over-stats">
        <div class="game-over-stat ok"><div class="stat-num">${correct}</div><div class="stat-label">Đúng</div></div>
        <div class="game-over-stat total"><div class="stat-num">${total}</div><div class="stat-label">Tổng</div></div>
        <div class="game-over-stat bad"><div class="stat-num">${wrong}</div><div class="stat-label">Sai</div></div>
      </div>
      <div style="font-size:0.95rem;color:var(--muted);margin-bottom:28px">Tỉ lệ đúng: <strong style="color:var(--accent)">${pct}%</strong></div>
      <button class="btn-start" onclick="closeGameOver()"><i data-lucide="refresh-ccw"></i> New Game</button>
    </div>
  `;
  overlay.style.display = 'flex';
  lucide.createIcons({ nodes: [overlay] });
}

function closeGameOver() {
  const overlay = document.getElementById('gameover-overlay');
  if (overlay) overlay.style.display = 'none';
  resetCurrentGame();
}
