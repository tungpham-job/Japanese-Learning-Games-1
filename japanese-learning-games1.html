<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日本語学習 — Japanese Learning Games</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D0F1A;
  --surface: #161929;
  --card: #1E2440;
  --card-hover: #252C4E;
  --border: #2A3260;
  --accent: #F5C842;
  --accent2: #FF6B8A;
  --accent3: #6BFFB8;
  --text: #E8EAFF;
  --muted: #7B82A8;
  --correct: #4DFFC2;
  --wrong: #FF5577;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 48px;
  background-image: radial-gradient(ellipse 80% 60% at 50% -20%, #1a1f4a 0%, transparent 70%);
}

/* ══════════════════════════════
   COMPACT HEADER
══════════════════════════════ */
.app-header {
  background: linear-gradient(180deg, #12162a 0%, #0D0F1A 100%);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.header-title { flex: 1; }
.title-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  letter-spacing: 1px;
}
.title-sub {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: 1px;
}
.header-icons { display: flex; gap: 8px; align-items: center; }
.hdr-icon-btn {
  width: 38px; height: 38px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  border-radius: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  transition: all 0.2s;
  flex-shrink: 0;
}
.hdr-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.hdr-icon-btn.active { border-color: var(--accent); background: var(--card); color: var(--accent); }

/* ══════════════════════════════
   GAME ZONE  (panels + window)
══════════════════════════════ */
.game-zone {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px 0;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

/* Shared panel style */
.side-panel {
  flex-shrink: 0;
  width: 0;
  overflow: hidden;
  opacity: 0;
  transition: width 0.32s cubic-bezier(0.4,0,0.2,1), opacity 0.22s ease;
}
.side-panel.open { width: 148px; opacity: 1; }
.panel-inner {
  width: 148px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.panel-label {
  font-size: 0.62rem;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  padding: 0 4px 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}

/* ── Settings panel specific ── */
/* Script toggle gạt (pill) */
.script-gat {
  display: flex;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 3px;
  gap: 0;
}
.script-gat-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 6px 4px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.22s;
  text-align: center;
  line-height: 1.2;
}
.script-gat-btn.active { background: var(--accent); color: #0D0F1A; }

/* Cat buttons dọc */
.cat-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 1px;
  text-align: left;
  width: 100%;
}
.cat-btn .cat-main { font-size: 0.78rem; }
.cat-btn .cat-sub { font-size: 0.6rem; color: var(--muted); font-weight: 400; }
.cat-btn.active { border-color: var(--accent2); color: var(--accent2); background: #1E2440; }
.cat-btn.active .cat-sub { color: var(--accent2); opacity: 0.7; }

/* ── Game list panel specific ── */
.tab-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  white-space: nowrap;
}
.tab-btn:hover { background: var(--card); color: var(--text); }
.tab-btn.active { background: var(--card); border-color: var(--border); color: var(--accent); }

/* Game window */
.game-window {
  flex: 1;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  min-height: 420px;
}
.game-window-header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 9px 18px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.game-window-header .game-icon { font-size: 0.9rem; }
.game-window-header .game-name {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.3px;
}
.game-window-body { padding: 24px 20px; }

/* ─── FLASHCARD ─── */
#game-flashcard .card-scene {
  perspective: 1000px;
  cursor: pointer;
  user-select: none;
  height: 280px;
  margin-bottom: 20px;
}
.card-3d {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.card-3d.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.card-front { background: linear-gradient(135deg, #1E2440 0%, #252C55 100%); }
.card-back { background: linear-gradient(135deg, #1A3040 0%, #1A3855 100%); transform: rotateY(180deg); }
.kana-big {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 7rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}
.card-hint { font-size: 0.78rem; color: var(--muted); margin-top: 14px; letter-spacing: 1px; }
.romaji-big { font-size: 3rem; font-weight: 700; color: var(--accent3); letter-spacing: 2px; }
.fc-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}
.fc-controls button {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.fc-controls button:hover { background: var(--card-hover); border-color: var(--accent); }
.fc-controls .btn-primary { background: var(--accent); color: #0D0F1A; border-color: var(--accent); }
.fc-controls .btn-primary:hover { background: #f0c030; }
.progress-text { color: var(--muted); font-size: 0.85rem; min-width: 70px; text-align: center; }

/* ─── QUIZ ─── */
#game-quiz .q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 18px;
}
.q-kana {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 6rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}
.q-prompt { color: var(--muted); font-size: 0.82rem; margin-top: 12px; }
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.opt-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 1.1rem;
  font-weight: 600;
  padding: 18px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.opt-btn:hover:not(:disabled) { background: var(--card-hover); border-color: var(--accent); }
.opt-btn.correct { background: #1A3A30; border-color: var(--correct); color: var(--correct); }
.opt-btn.wrong { background: #3A1A20; border-color: var(--wrong); color: var(--wrong); }
.opt-btn:disabled { cursor: default; }
.quiz-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
.score-item { text-align: center; }
.score-num { font-size: 1.8rem; font-weight: 700; }
.score-label { font-size: 0.72rem; color: var(--muted); }
.score-correct .score-num { color: var(--correct); }
.score-wrong .score-num { color: var(--wrong); }
.feedback-msg { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 10px; font-weight: 600; }
.feedback-msg.ok { color: var(--correct); }
.feedback-msg.fail { color: var(--wrong); }

/* ─── TYPING ─── */
#game-typing .t-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 18px;
}
.t-kana {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 6rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 8px;
}
.t-input-wrap { margin-bottom: 12px; }
.t-input {
  display: block;
  width: 100%;
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--text);
  font-size: 1.4rem;
  font-weight: 600;
  text-align: center;
  letter-spacing: 3px;
  padding: 14px;
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.2s;
  box-sizing: border-box;
  -webkit-appearance: none;
}
.t-input:focus { border-color: var(--accent); }
.t-input.correct { border-color: var(--correct); background: #1A3A30; }
.t-input.wrong { border-color: var(--wrong); background: #3A1A20; }
.t-action-row {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
}
.t-submit {
  border: none;
  background: var(--accent);
  color: #0D0F1A;
  font-weight: 700;
  font-size: 0.9rem;
  padding: 11px 28px;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.2s;
}
.t-submit:hover { background: #f0c030; }
.t-feedback { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 12px; font-weight: 600; }
.t-feedback.ok { color: var(--correct); }
.t-feedback.fail { color: var(--wrong); }
.t-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 14px; }
.t-streak { color: var(--accent); font-size: 0.85rem; text-align: center; margin-bottom: 8px; }

/* ─── MATCHING ─── */
#game-matching .m-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.m-timer { font-size: 1.5rem; font-weight: 700; color: var(--accent); min-width: 60px; }
.m-stats { color: var(--muted); font-size: 0.82rem; }
.m-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
/* Matching tile — no sub-label, bigger kana */
.m-tile {
  aspect-ratio: 1;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.18s;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  position: relative;
  overflow: hidden;
  user-select: none;
}
.m-tile:hover:not(.matched):not(.selected) { background: var(--card-hover); border-color: var(--accent); transform: scale(1.04); }
.m-tile.selected { border-color: var(--accent); background: #252C55; box-shadow: 0 0 0 2px var(--accent); }
.m-tile.matched { border-color: var(--correct); background: #1A3A30; color: var(--correct); cursor: default; }
.m-tile.wrong-flash { border-color: var(--wrong); background: #3A1A20; animation: wrongShake 0.35s; }
/* kana tile: big kana, no sub-text */
.m-tile.type-kana .tile-kana {
  font-size: 2.2rem;
  color: var(--accent);
  line-height: 1;
}
.m-tile.matched.type-kana .tile-kana { color: var(--correct); }
/* romaji tile: big romaji text */
.m-tile.type-rom .tile-rom {
  font-size: 1.1rem;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}
.m-tile.matched.type-rom .tile-rom { color: var(--correct); }
.m-size-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.m-size-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 0.78rem;
  padding: 6px 16px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.m-size-btn.active { border-color: var(--accent2); color: var(--accent2); background: var(--card); }
@keyframes wrongShake {
  0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}
}
/* Buttons */
.btn-start {
  border: none;
  background: var(--accent);
  color: #0D0F1A;
  font-weight: 700;
  font-size: 1rem;
  padding: 12px 30px;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-start:hover { background: #f0c030; }
/* Progress bar */
.prog-bar-wrap {
  background: var(--card);
  border-radius: 50px;
  height: 4px;
  margin-bottom: 16px;
  overflow: hidden;
}
.prog-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 50px;
  transition: width 0.3s;
}
/* ─── SPEED RECOGNITION ─── */
#game-speed .sr-display {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.sr-kana {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 7rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  transition: opacity 0.1s;
}
.sr-kana.hide { opacity: 0; }
.sr-timer-ring {
  position: absolute;
  top: 10px; right: 14px;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--accent);
  transition: color 0.2s;
  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}
.sr-timer-ring.urgent { color: var(--wrong); }
.sr-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.sr-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 14px; }
.sr-feedback { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 10px; font-weight: 600; }
.sr-feedback.ok { color: var(--correct); }
.sr-feedback.fail { color: var(--wrong); }
.sr-speed-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.sr-speed-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 0.78rem;
  padding: 6px 16px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.sr-speed-btn.active { border-color: var(--accent2); color: var(--accent2); background: var(--card); }

/* ─── LISTEN & PICK ─── */
#game-listen .lp-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 16px;
}
.lp-speak-btn {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: var(--surface);
  color: var(--accent);
  font-size: 3rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
}
.lp-speak-btn:hover { background: var(--card); transform: scale(1.05); }
.lp-speak-btn.speaking { background: var(--accent); color: #0D0F1A; animation: pulse 0.6s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
.lp-hint { color: var(--muted); font-size: 0.82rem; }
.lp-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.lp-opt {
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--accent);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lp-opt:hover:not(:disabled) { background: var(--card-hover); border-color: var(--accent); transform: scale(1.04); }
.lp-opt.correct { background: #1A3A30; border-color: var(--correct); color: var(--correct); }
.lp-opt.wrong { background: #3A1A20; border-color: var(--wrong); color: var(--wrong); }
.lp-opt:disabled { cursor: default; transform: none; }
.lp-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 14px; }
.lp-feedback { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 10px; font-weight: 600; }
.lp-feedback.ok { color: var(--correct); }
.lp-feedback.fail { color: var(--wrong); }

/* responsive */
/* Typing — ẩn score/streak khi focus input */
#game-typing.keyboard-open .t-score,
#game-typing.keyboard-open .t-streak,
#game-typing.keyboard-open .prog-bar-wrap {
  display: none;
}

@media(max-width:600px){
  .kana-big,.q-kana,.t-kana { font-size: 4.5rem; }
  .m-tile.type-kana .tile-kana { font-size: 1.7rem; }
  .m-tile.type-rom .tile-rom { font-size: 0.9rem; }
  .quiz-options { gap: 8px; }
  .opt-btn { padding: 14px 6px; font-size: 0.95rem; }

  /* Game zone: bỏ padding để game-window chiếm full width */
  .game-zone { padding: 10px 10px 0; gap: 0; }

  /* Panel overlay phủ lên trên thay vì đẩy game-window hẹp lại */
  .side-panel {
    position: absolute;
    z-index: 100;
    left: 10px;
    top: 0;
    width: 0;
    opacity: 0;
  }
  .side-panel.open { width: 148px; opacity: 1; }

  /* game-zone cần position relative để panel absolute hoạt động */
  .game-zone { position: relative; }

  /* game-window chiếm toàn bộ width */
  .game-window { width: 100%; }

  .game-window-body { padding: 18px 14px; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     COMPACT HEADER
══════════════════════════════════════ -->
<div class="app-header">
  <div class="header-title">
    <div class="title-jp">日本語学習</div>
    <div class="title-sub" id="header-sub">ひらがな · Basic</div>
  </div>
  <div class="header-icons">
    <button class="hdr-icon-btn" id="btn-panel-settings" onclick="togglePanel('settings')" title="Thiết lập">⚙</button>
    <button class="hdr-icon-btn" id="btn-panel-games" onclick="togglePanel('games')" title="Chọn game">☰</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     GAME ZONE
══════════════════════════════════════ -->
<div class="game-zone">

  <!-- Panel: Thiết lập -->
  <div class="side-panel" id="panel-settings">
    <div class="panel-inner">
      <div class="panel-label">Thiết lập</div>
      <!-- Script toggle gạt dọc -->
      <div class="script-gat">
        <button class="script-gat-btn active" id="btn-hira" onclick="setScript('hiragana')">ひら<br>Hira</button>
        <button class="script-gat-btn" id="btn-kata" onclick="setScript('katakana')">カタ<br>Kata</button>
      </div>
      <!-- 3 cat buttons dọc -->

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const DATA = {
  hiragana: {

      ['あ','a'],['い','i'],['う','u'],['え','e'],['お','o'],

      ['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho'],
      ['にゃ','nya'],['にゅ','nyu'],['にょ','nyo'],
      ['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo'],
      ['びゃ','bya'],['びゅ','byu'],['びょ','byo'],
      ['みゃ','mya'],['みゅ','myu'],['みょ','myo'],
      ['ぴゃ','pya'],['ぴゅ','pyu'],['ぴょ','pyo'],
      ['りゃ','rya'],['りゅ','ryu'],['りょ','ryo']
    ]
  },
  katakana: {
    basic: [
      ['ア','a'],['イ','i'],['ウ','u'],['エ','e'],['オ','o'],
      ['カ','ka'],['キ','ki'],['ク','ku'],['ケ','ke'],['コ','ko'],
      ['サ','sa'],['シ','shi'],['ス','su'],['セ','se'],['ソ','so'],
      ['タ','ta'],['チ','chi'],['ツ','tsu'],['テ','te'],['ト','to'],
      ['ナ','na'],['ニ','ni'],['ヌ','nu'],['ネ','ne'],['ノ','no'],
      ['ハ','ha'],['ヒ','hi'],['フ','fu'],['ヘ','he'],['ホ','ho'],
      ['マ','ma'],['ミ','mi'],['ム','mu'],['メ','me'],['モ','mo'],
      ['ヤ','ya'],['ユ','yu'],['ヨ','yo'],
      ['ラ','ra'],['リ','ri'],['ル','ru'],['レ','re'],['ロ','ro'],
      ['ワ','wa'],['ヲ','wo'],['ン','n']
    ],
    dakuten: [
      ['ガ','ga'],['ギ','gi'],['グ','gu'],['ゲ','ge'],['ゴ','go'],
      ['ザ','za'],['ジ','ji'],['ズ','zu'],['ゼ','ze'],['ゾ','zo'],
      ['ダ','da'],['ヂ','ji'],['ヅ','du'],['デ','de'],['ド','do'],
      ['バ','ba'],['ビ','bi'],['ブ','bu'],['ベ','be'],['ボ','bo'],
      ['パ','pa'],['ピ','pi'],['プ','pu'],['ペ','pe'],['ポ','po']
    ],
    combo: [
      ['キャ','kya'],['キュ','kyu'],['キョ','kyo'],
      ['ギャ','gya'],['ギュ','gyu'],['ギョ','gyo'],
      ['シャ','sha'],['シュ','shu'],['ショ','sho'],
      ['ジャ','ja'],['ジュ','ju'],['ジョ','jo'],
      ['チャ','cha'],['チュ','chu'],['チョ','cho'],
      ['ニャ','nya'],['ニュ','nyu'],['ニョ','nyo'],
      ['ヒャ','hya'],['ヒュ','hyu'],['ヒョ','hyo'],
      ['ビャ','bya'],['ビュ','byu'],['ビョ','byo'],
      ['ミャ','mya'],['ミュ','myu'],['ミョ','myo'],
      ['ピャ','pya'],['ピュ','pyu'],['ピョ','pyo'],
      ['リャ','rya'],['リュ','ryu'],['リョ','ryo']
    ]
  }
};

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let currentScript = 'hiragana';
let currentGame = 'flashcard';
let activeCategories = ['basic'];

function getPool() {
  let pool = [];
  activeCategories.forEach(c => { pool = pool.concat(DATA[currentScript][c]); });
  return pool;
}

// Set script (hiragana / katakana)
function setScript(s) {
  currentScript = s;
  document.getElementById('btn-hira').classList.toggle('active', s==='hiragana');
  document.getElementById('btn-kata').classList.toggle('active', s==='katakana');
  updateHeaderSub();
  resetCurrentGame();
}

// Toggle category
function toggleCat(c) {
  if (activeCategories.includes(c)) {
    if (activeCategories.length === 1) return;
    activeCategories = activeCategories.filter(x => x !== c);
  } else {
    activeCategories.push(c);
  }
  document.getElementById('cat-basic').classList.toggle('active', activeCategories.includes('basic'));
  document.getElementById('cat-dakuten').classList.toggle('active', activeCategories.includes('dakuten'));
  document.getElementById('cat-combo').classList.toggle('active', activeCategories.includes('combo'));
  updateHeaderSub();
  resetCurrentGame();
}

// Panel toggle (settings | games) — chỉ 1 panel mở tại 1 thời điểm
let openPanel = null;
function togglePanel(name) {
  const isSame = openPanel === name;
  // Đóng tất cả
  ['settings','games'].forEach(p => {
    document.getElementById('panel-'+p).classList.remove('open');
    document.getElementById('btn-panel-'+p).classList.remove('active');
  });
  if (!isSame) {
    document.getElementById('panel-'+name).classList.add('open');
    document.getElementById('btn-panel-'+name).classList.add('active');
    openPanel = name;
  } else {
    openPanel = null;
  }
}

function updateHeaderSub() {
  const script = currentScript === 'hiragana' ? 'ひらがな' : 'カタカナ';
  const cats = activeCategories.map(c => c === 'basic' ? 'Basic' : c === 'dakuten' ? 'Dakuten' : 'Combo').join(' · ');
  document.getElementById('header-sub').textContent = script + ' · ' + cats;
}

// Switch game mode
const ALL_GAMES = ['flashcard','quiz','typing','matching','speed','listen'];
const GAME_META = {
  flashcard: { icon: '🃏', name: 'Flashcard' },
  quiz:      { icon: '🎯', name: 'Quiz' },
  typing:    { icon: '⌨️', name: 'Typing' },
  matching:  { icon: '🔗', name: 'Matching' },
  speed:     { icon: '⚡', name: 'Speed Rec' },
  listen:    { icon: '👂', name: 'Listen' },
};
function setGame(g) {
  currentGame = g;
  ALL_GAMES.forEach(id => {
    document.getElementById('game-'+id).style.display = id===g ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ALL_GAMES[i]===g);
  });
  // Cập nhật inner header
  const meta = GAME_META[g];
  document.getElementById('gwin-icon').textContent = meta.icon;
  document.getElementById('gwin-name').textContent = meta.name;
  // Đóng panel game sau khi chọn
  document.getElementById('panel-games').classList.remove('open');
  document.getElementById('btn-panel-games').classList.remove('active');
  openPanel = null;
  resetCurrentGame();
}

function resetCurrentGame() {
  if (currentGame==='flashcard') initFlashcard();
  if (currentGame==='quiz') startQuiz();
  if (currentGame==='typing') startTyping();
  if (currentGame==='matching') startMatching();
  if (currentGame==='speed') startSpeed();
  if (currentGame==='listen') startListen();
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function randItems(arr, n) { return shuffle(arr).slice(0, Math.min(n, arr.length)); }

// ═══════════════════════════════════════════
// FLASHCARD
// ═══════════════════════════════════════════
let fcCards = [], fcIndex = 0, fcFlipped = false;

function initFlashcard() {
  fcCards = shuffle(getPool());
  fcIndex = 0; fcFlipped = false;
  document.getElementById('card-3d').classList.remove('flipped');
  renderFCCard();
}

function renderFCCard() {
  const [kana, rom] = fcCards[fcIndex];
  document.getElementById('fc-kana').textContent = kana;
  document.getElementById('fc-romaji').textContent = rom;
  document.getElementById('fc-back-kana').textContent = kana;
  document.getElementById('fc-progress').textContent = (fcIndex+1)+' / '+fcCards.length;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('card-3d').classList.toggle('flipped', fcFlipped);
}

function fcNav(dir) {
  fcIndex = (fcIndex + dir + fcCards.length) % fcCards.length;
  fcFlipped = false;
  document.getElementById('card-3d').classList.remove('flipped');
  renderFCCard();
}

function fcShuffle() {
  fcCards = shuffle(getPool()); fcIndex = 0; fcFlipped = false;
  document.getElementById('card-3d').classList.remove('flipped');
  renderFCCard();
}

// ═══════════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════════
let qPool = [], qIndex = 0, qCorrect = 0, qWrong = 0, qAnswered = false;

function startQuiz() {
  qPool = shuffle(getPool());
  qIndex = 0; qCorrect = 0; qWrong = 0; qAnswered = false;
  updateQScore(); renderQuestion();
}

function renderQuestion() {
  if (qIndex >= qPool.length) { qPool = shuffle(getPool()); qIndex = 0; }
  const pool = getPool();
  const [kana, correct] = qPool[qIndex];
  document.getElementById('q-kana').textContent = kana;
  document.getElementById('q-feedback').textContent = '';
  document.getElementById('q-feedback').className = 'feedback-msg';
  let wrongs = pool.filter(x => x[1] !== correct);
  wrongs = shuffle(wrongs).slice(0,3).map(x=>x[1]);
  const opts = shuffle([correct, ...wrongs]);
  const wrap = document.getElementById('quiz-options');
  wrap.innerHTML = '';
  opts.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt-btn'; b.textContent = opt;
    b.onclick = () => selectAnswer(b, opt, correct);
    wrap.appendChild(b);
  });
  qAnswered = false;
  document.getElementById('q-prog').style.width = Math.min(100, ((qCorrect+qWrong)/(qPool.length||1))*100)+'%';
}

function selectAnswer(btn, chosen, correct) {
  if (qAnswered) return;
  qAnswered = true;
  const fb = document.getElementById('q-feedback');
  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = '✓ Correct!'; fb.className = 'feedback-msg ok'; qCorrect++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ Wrong — answer: ' + correct; fb.className = 'feedback-msg fail'; qWrong++;
    document.querySelectorAll('.opt-btn').forEach(b => { if (b.textContent===correct) b.classList.add('correct'); });
  }
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  updateQScore(); qIndex++;
  setTimeout(renderQuestion, 1000);
}

function updateQScore() {
  document.getElementById('q-correct').textContent = qCorrect;
  document.getElementById('q-wrong').textContent = qWrong;
  document.getElementById('q-total').textContent = qCorrect+qWrong;
}

// ═══════════════════════════════════════════
// TYPING
// ═══════════════════════════════════════════
let tPool = [], tIndex = 0, tCorrect = 0, tWrong = 0, tStreak = 0;

function startTyping() {
  tPool = shuffle(getPool());
  tIndex = 0; tCorrect = 0; tWrong = 0; tStreak = 0;
  updateTScore(); renderTyping();
}

function renderTyping() {
  if (tIndex >= tPool.length) { tPool = shuffle(getPool()); tIndex = 0; }
  const [kana] = tPool[tIndex];
  document.getElementById('t-kana').textContent = kana;
  document.getElementById('t-feedback').textContent = '';
  document.getElementById('t-feedback').className = 't-feedback';
  const inp = document.getElementById('t-input');
  inp.value = ''; inp.className = 't-input'; inp.focus();
  document.getElementById('t-prog').style.width = Math.min(100, ((tCorrect+tWrong)/(tPool.length||1))*100)+'%';
  updateStreakDisplay();
}

function handleTypingKey(e) { if (e.key==='Enter') checkTyping(); }

// Ẩn score/streak khi bàn phím ảo hiện lên (mobile)
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('t-input');
  if (!inp) return;
  inp.addEventListener('focus', () => {
    document.getElementById('game-typing').classList.add('keyboard-open');
  });
  inp.addEventListener('blur', () => {
    document.getElementById('game-typing').classList.remove('keyboard-open');
  });
});

function checkTyping() {
  const inp = document.getElementById('t-input');
  const answer = inp.value.trim().toLowerCase();
  const [, correct] = tPool[tIndex];
  const fb = document.getElementById('t-feedback');
  if (!answer) { inp.focus(); return; }
  if (correct.split('/').includes(answer)) {
    inp.className = 't-input correct';
    fb.textContent = '✓ Correct!'; fb.className = 't-feedback ok';
    tCorrect++; tStreak++;
    updateTScore(); tIndex++;
    setTimeout(renderTyping, 700);
  } else {
    inp.className = 't-input wrong';
    fb.textContent = '✗ Answer: ' + correct; fb.className = 't-feedback fail';
    tWrong++; tStreak = 0;
    updateTScore(); tIndex++;
    setTimeout(renderTyping, 900);
  }
}

function skipTyping() { tStreak = 0; tIndex++; renderTyping(); }

function updateTScore() {
  document.getElementById('t-correct').textContent = tCorrect;
  document.getElementById('t-wrong').textContent = tWrong;
  document.getElementById('t-total').textContent = tCorrect+tWrong;
  updateStreakDisplay();
}

function updateStreakDisplay() {
  const el = document.getElementById('t-streak-txt');
  if (tStreak >= 3) {
    const fire = tStreak >= 5 ? '🔥🔥🔥' : tStreak >= 4 ? '🔥🔥' : '🔥';
    el.textContent = fire + ' Streak: ' + tStreak;
  } else { el.textContent = ''; }
}

// ═══════════════════════════════════════════
// MATCHING
// ═══════════════════════════════════════════
let matchSize = 8, matchTiles = [], matchSelected = null, matchPairs = 0, matchMoves = 0;
let matchTimer = 0, matchInterval = null, matchDone = false;

function setMatchSize(n) {
  matchSize = n;
  document.querySelectorAll('.m-size-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().startsWith(n));
  });
  startMatching();
}

function startMatching() {
  clearInterval(matchInterval);
  matchTimer = 0; matchPairs = 0; matchMoves = 0; matchSelected = null; matchDone = false;
  document.getElementById('m-result-msg').textContent = '';
  document.getElementById('m-total-pairs').textContent = matchSize;

  const pool = randItems(getPool(), matchSize);
  matchTiles = [];
  pool.forEach((pair, i) => {
    matchTiles.push({ id: i*2,   pairId: i, type: 'kana', display: pair[0], matched: false });
    matchTiles.push({ id: i*2+1, pairId: i, type: 'rom',  display: pair[1], matched: false });
  });
  matchTiles = shuffle(matchTiles);
  renderMatchGrid(); updateMatchStats();
  matchInterval = setInterval(() => { if (!matchDone) { matchTimer++; updateMatchTimer(); } }, 1000);
}

function renderMatchGrid() {
  const grid = document.getElementById('m-grid');
  grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
  grid.innerHTML = '';
  matchTiles.forEach(tile => {
    const el = document.createElement('div');
    el.className = 'm-tile type-' + tile.type + (tile.matched ? ' matched' : '');
    el.dataset.id = tile.id;
    if (tile.type === 'kana') {
      el.innerHTML = `<span class="tile-kana">${tile.display}</span>`;
    } else {
      el.innerHTML = `<span class="tile-rom">${tile.display}</span>`;
    }
    if (!tile.matched) el.onclick = () => selectMatchTile(tile.id);
    grid.appendChild(el);
  });
}

function selectMatchTile(id) {
  if (matchDone) return;
  const tile = matchTiles.find(t => t.id===id);
  if (!tile || tile.matched) return;
  const el = document.querySelector(`.m-tile[data-id="${id}"]`);

  if (matchSelected === null) {
    matchSelected = id; el.classList.add('selected'); return;
  }
  if (matchSelected === id) {
    el.classList.remove('selected'); matchSelected = null; return;
  }

  const prev = matchTiles.find(t => t.id===matchSelected);
  const prevEl = document.querySelector(`.m-tile[data-id="${matchSelected}"]`);
  matchMoves++;

  if (prev.pairId === tile.pairId) {
    prev.matched = true; tile.matched = true;
    prevEl.classList.remove('selected'); prevEl.classList.add('matched');
    el.classList.add('matched');
    matchPairs++; matchSelected = null;
    updateMatchStats();
    if (matchPairs === matchSize) {
      matchDone = true; clearInterval(matchInterval);
      const m = Math.floor(matchTimer/60), s = matchTimer%60;
      document.getElementById('m-result-msg').innerHTML = `🎉 Cleared in ${m}:${String(s).padStart(2,'0')} with ${matchMoves} moves!`;
    }
  } else {
    el.classList.add('wrong-flash'); prevEl.classList.add('wrong-flash');
    matchSelected = null;
    setTimeout(() => {
      el.classList.remove('wrong-flash','selected');
      prevEl.classList.remove('wrong-flash','selected');
    }, 400);
  }
  updateMatchStats();
}

function updateMatchTimer() {
  const m = Math.floor(matchTimer/60), s = matchTimer%60;
  document.getElementById('m-timer').textContent = m+':'+String(s).padStart(2,'0');
}
function updateMatchStats() {
  document.getElementById('m-pairs').textContent = matchPairs;
  document.getElementById('m-moves').textContent = matchMoves;
}

// ═══════════════════════════════════════════
// SPEED RECOGNITION
// ═══════════════════════════════════════════
let srPool=[], srIndex=0, srCorrect=0, srWrong=0, srSpeed=3, srCountdown=null, srAnswered=false, srTimeLeft=0;

function setSRSpeed(s) {
  srSpeed = s;
  startSpeed();
}

function startSpeed() {
  clearInterval(srCountdown);
  srPool = shuffle(getPool());
  srIndex=0; srCorrect=0; srWrong=0; srAnswered=false;
  updateSRScore(); renderSpeed();
}

function renderSpeed() {
  if (srIndex >= srPool.length) { srPool = shuffle(getPool()); srIndex=0; }
  clearInterval(srCountdown);
  srAnswered = false;

  const pool = getPool();
  const [kana, correct] = srPool[srIndex];
  const kanaEl = document.getElementById('sr-kana');
  const timerEl = document.getElementById('sr-timer');
  const fb = document.getElementById('sr-feedback');

  kanaEl.className = 'sr-kana';
  kanaEl.textContent = kana;
  fb.textContent = ''; fb.className = 'sr-feedback';

  // Build options
  let wrongs = pool.filter(x => x[1] !== correct);
  wrongs = shuffle(wrongs).slice(0,3).map(x=>x[1]);
  const opts = shuffle([correct, ...wrongs]);
  const wrap = document.getElementById('sr-options');
  wrap.innerHTML = '';
  opts.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt-btn'; b.textContent = opt;
    b.onclick = () => srSelect(b, opt, correct);
    wrap.appendChild(b);
  });

  // Countdown timer
  srTimeLeft = srSpeed;
  timerEl.textContent = srTimeLeft;
  timerEl.className = 'sr-timer-ring';
  document.getElementById('sr-prog').style.width = Math.min(100,((srCorrect+srWrong)/(srPool.length||1))*100)+'%';

  // Hide kana after srSpeed seconds
  const hideAt = srSpeed * 1000 - 200;
  const hideTimer = setTimeout(() => { kanaEl.classList.add('hide'); }, hideAt);

  srCountdown = setInterval(() => {
    srTimeLeft--;
    timerEl.textContent = srTimeLeft;
    if (srTimeLeft <= 1) timerEl.className = 'sr-timer-ring urgent';
    if (srTimeLeft <= 0) {
      clearTimeout(hideTimer);
      clearInterval(srCountdown);
      if (!srAnswered) {
        // Time's up
        srAnswered = true;
        srWrong++;
        fb.textContent = '⏱ Time up! — ' + correct; fb.className = 'sr-feedback fail';
        document.querySelectorAll('#sr-options .opt-btn').forEach(b => {
          if (b.textContent===correct) b.classList.add('correct');
          b.disabled = true;
        });
        updateSRScore();
        srIndex++;
        setTimeout(renderSpeed, 1000);
      }
    }
  }, 1000);
}

function srSelect(btn, chosen, correct) {
  if (srAnswered) return;
  srAnswered = true;
  clearInterval(srCountdown);
  document.getElementById('sr-kana').classList.remove('hide');
  const fb = document.getElementById('sr-feedback');
  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = '✓ Correct!'; fb.className = 'sr-feedback ok'; srCorrect++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ Wrong — ' + correct; fb.className = 'sr-feedback fail'; srWrong++;
    document.querySelectorAll('#sr-options .opt-btn').forEach(b => { if(b.textContent===correct) b.classList.add('correct'); });
  }
  document.querySelectorAll('#sr-options .opt-btn').forEach(b => b.disabled=true);
  updateSRScore(); srIndex++;
  setTimeout(renderSpeed, 900);
}

function updateSRScore() {
  document.getElementById('sr-correct').textContent = srCorrect;
  document.getElementById('sr-wrong').textContent = srWrong;
  document.getElementById('sr-total').textContent = srCorrect+srWrong;
}

// ═══════════════════════════════════════════
// LISTEN & PICK
// ═══════════════════════════════════════════
let lpPool=[], lpIndex=0, lpCorrect=0, lpWrong=0, lpAnswered=false;
let lpCurrentKanas=[], lpCurrentRom='', lpRepeatCount=1;
let lpRate=0.6, lpPitch=1.1, lpSelectedVoice='';

function lpLoadVoices() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('ja'));
  const sel = document.getElementById('lp-voice-select');
  if (!sel) return;
  sel.innerHTML = '<option value="">Default</option>';
  voices.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name.replace(/Microsoft |Google |Apple /, '').substring(0, 20);
    sel.appendChild(opt);
  });
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = lpLoadVoices;
  lpLoadVoices();
}

function startListen() {
  lpPool = shuffle(getPool());
  lpIndex=0; lpCorrect=0; lpWrong=0; lpAnswered=false;
  updateLPScore(); renderListen();
}

function renderListen() {
  if (lpIndex >= lpPool.length) { lpPool = shuffle(getPool()); lpIndex=0; }
  lpAnswered = false;
  const pool = getPool();
  // Câu hỏi: chữ đầu tiên là đáp án cần tìm
  const [kana, correct] = lpPool[lpIndex];
  lpCurrentRom = correct;

  // Chọn thêm (lpRepeatCount-1) chữ ngẫu nhiên để đọc kèm
  const extras = shuffle(pool.filter(x => x[1] !== correct)).slice(0, lpRepeatCount - 1);
  // Xáo vị trí chữ đáp án trong chuỗi đọc
  const readList = shuffle([[kana, correct], ...extras]);
  lpCurrentKanas = readList.map(x => x[0]);

  document.getElementById('lp-feedback').textContent = '';
  document.getElementById('lp-feedback').className = 'lp-feedback';
  document.getElementById('lp-speak-btn').className = 'lp-speak-btn';
  document.getElementById('lp-prog').style.width = Math.min(100,((lpCorrect+lpWrong)/(lpPool.length||1))*100)+'%';

  // Hint: nếu đọc nhiều chữ thì cho biết đáp án là chữ thứ mấy
  const answerPos = readList.findIndex(x => x[1] === correct) + 1;
  const hintEl = document.getElementById('lp-hint');
  if (lpRepeatCount === 1) {
    hintEl.textContent = 'Nhấn để nghe — chọn kana đúng bên dưới';
  } else {
    hintEl.textContent = `Nghe ${lpRepeatCount} chữ — chọn chữ thứ ${answerPos}`;
  }

  // Build kana options
  let wrongs = pool.filter(x => x[1] !== correct);
  wrongs = shuffle(wrongs).slice(0, 7);
  const opts = shuffle([[kana, correct], ...wrongs.map(x=>[x[0],x[1]])]).slice(0, 8);

  const wrap = document.getElementById('lp-options');
  wrap.innerHTML = '';
  opts.forEach(([k, rom]) => {
    const b = document.createElement('button');
    b.className = 'lp-opt'; b.textContent = k;
    b.onclick = () => lpSelect(b, rom, correct, kana);
    wrap.appendChild(b);
  });

  // Auto-speak sau delay ngắn
  setTimeout(lpSpeak, 400);
}

function lpSpeak() {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const btn = document.getElementById('lp-speak-btn');
  btn.className = 'lp-speak-btn speaking';

  // Đọc từng chữ cách nhau 1000ms
  let i = 0;
  const allVoices = speechSynthesis.getVoices();
  const chosenVoice = lpSelectedVoice
    ? allVoices.find(v => v.name === lpSelectedVoice)
    : allVoices.find(v => v.lang.startsWith('ja')) || null;

  function speakNext() {
    if (i >= lpCurrentKanas.length) {
      btn.className = 'lp-speak-btn';
      return;
    }
    const utter = new SpeechSynthesisUtterance(lpCurrentKanas[i]);
    utter.lang = 'ja-JP';
    utter.rate = lpRate;
    utter.pitch = lpPitch;
    if (chosenVoice) utter.voice = chosenVoice;
    utter.onend = () => {
      i++;
      if (i < lpCurrentKanas.length) {
        setTimeout(speakNext, 800);
      } else {
        btn.className = 'lp-speak-btn';
      }
    };
    speechSynthesis.speak(utter);
  }
  speakNext();
}

function lpSelect(btn, chosen, correct, correctKana) {
  if (lpAnswered) return;
  lpAnswered = true;
  const fb = document.getElementById('lp-feedback');
  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = '✓ Correct!'; fb.className = 'lp-feedback ok'; lpCorrect++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ Wrong — ' + correct; fb.className = 'lp-feedback fail'; lpWrong++;
    document.querySelectorAll('#lp-options .lp-opt').forEach(b => {
      if (b.textContent === correctKana) b.classList.add('correct');
    });
  }
  document.querySelectorAll('#lp-options .lp-opt').forEach(b => b.disabled=true);
  updateLPScore(); lpIndex++;
  setTimeout(renderListen, 1100);
}

function updateLPScore() {
  document.getElementById('lp-correct').textContent = lpCorrect;
  document.getElementById('lp-wrong').textContent = lpWrong;
  document.getElementById('lp-total').textContent = lpCorrect+lpWrong;
}

// INIT
// ═══════════════════════════════════════════
initFlashcard();
startQuiz();
startTyping();
startMatching();
startSpeed();
startListen();
