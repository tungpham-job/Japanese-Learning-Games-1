<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日本語学習 — Japanese Learning Games</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D0F1A;
  --surface: #161929;
  --card: #1E2440;
  --card-hover: #252C4E;
  --border: #2A3260;
  --accent: #F5C842;
  --accent2: #FF6B8A;
  --accent3: #6BFFB8;
  --text: #E8EAFF;
  --muted: #7B82A8;
  --correct: #4DFFC2;
  --wrong: #FF5577;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 48px;
  background-image: radial-gradient(ellipse 80% 60% at 50% -20%, #1a1f4a 0%, transparent 70%);
}

/* ══════════════════════════════
   SETUP ZONE
══════════════════════════════ */
.setup-zone {
  background: linear-gradient(180deg, #12162a 0%, #0D0F1A 100%);
  border-bottom: 1px solid var(--border);
  padding: 32px 20px 28px;
  text-align: center;
}

/* Title */
.title-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 2.4rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  letter-spacing: 2px;
}
.title-en {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 6px;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 400;
}

/* Script toggle */
.script-toggle {
  display: flex;
  justify-content: center;
  gap: 0;
  margin: 22px auto 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 5px;
  width: fit-content;
}
.script-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  padding: 10px 28px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.25s;
}
.script-btn.active { background: var(--accent); color: #0D0F1A; }

.cat-row {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.cat-btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  line-height: 1.3;
  text-align: center;
}
.cat-btn .cat-main { font-size: 0.78rem; }
.cat-btn .cat-sub { font-size: 0.62rem; color: var(--muted); font-weight: 400; }
.cat-btn.active {
  background: var(--card);
  border-color: var(--accent2);
  color: var(--accent2);
}
.cat-btn.active .cat-sub { color: var(--accent2); opacity: 0.7; }

/* ══════════════════════════════
   GAME ZONE
══════════════════════════════ */
.game-zone {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px;
}

/* Game tabs */
.game-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 24px 0 0;
  flex-wrap: wrap;
}
.tab-btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 9px 20px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 7px;
}
.tab-btn:hover { border-color: var(--accent); color: var(--text); }
.tab-btn.active { background: var(--card); border-color: var(--accent); color: var(--accent); }

/* Game window */
.game-window {
  margin-top: 22px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  min-height: 420px;
}

/* ─── FLASHCARD ─── */
#game-flashcard .card-scene {
  perspective: 1000px;
  cursor: pointer;
  user-select: none;
  height: 280px;
  margin-bottom: 20px;
}
.card-3d {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.card-3d.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.card-front { background: linear-gradient(135deg, #1E2440 0%, #252C55 100%); }
.card-back { background: linear-gradient(135deg, #1A3040 0%, #1A3855 100%); transform: rotateY(180deg); }
.kana-big {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 7rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}
.card-hint { font-size: 0.78rem; color: var(--muted); margin-top: 14px; letter-spacing: 1px; }
.romaji-big { font-size: 3rem; font-weight: 700; color: var(--accent3); letter-spacing: 2px; }
.fc-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}
.fc-controls button {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.fc-controls button:hover { background: var(--card-hover); border-color: var(--accent); }
.fc-controls .btn-primary { background: var(--accent); color: #0D0F1A; border-color: var(--accent); }
.fc-controls .btn-primary:hover { background: #f0c030; }
.progress-text { color: var(--muted); font-size: 0.85rem; min-width: 70px; text-align: center; }

/* ─── QUIZ ─── */
#game-quiz .q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 18px;
}
.q-kana {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 6rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}
.q-prompt { color: var(--muted); font-size: 0.82rem; margin-top: 12px; }
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.opt-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 1.1rem;
  font-weight: 600;
  padding: 18px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.opt-btn:hover:not(:disabled) { background: var(--card-hover); border-color: var(--accent); }
.opt-btn.correct { background: #1A3A30; border-color: var(--correct); color: var(--correct); }
.opt-btn.wrong { background: #3A1A20; border-color: var(--wrong); color: var(--wrong); }
.opt-btn:disabled { cursor: default; }
.quiz-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
.score-item { text-align: center; }
.score-num { font-size: 1.8rem; font-weight: 700; }
.score-label { font-size: 0.72rem; color: var(--muted); }
.score-correct .score-num { color: var(--correct); }
.score-wrong .score-num { color: var(--wrong); }
.feedback-msg { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 10px; font-weight: 600; }
.feedback-msg.ok { color: var(--correct); }
.feedback-msg.fail { color: var(--wrong); }

/* ─── TYPING ─── */
#game-typing .t-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 18px;
}
.t-kana {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 6rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 8px;
}
.t-input-wrap { display: flex; gap: 10px; margin-bottom: 14px; }
.t-input {
  flex: 1;
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--text);
  font-size: 1.4rem;
  font-weight: 600;
  text-align: center;
  letter-spacing: 3px;
  padding: 14px;
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.2s;
}
.t-input:focus { border-color: var(--accent); }
.t-input.correct { border-color: var(--correct); background: #1A3A30; }
.t-input.wrong { border-color: var(--wrong); background: #3A1A20; }
.t-submit {
  border: none;
  background: var(--accent);
  color: #0D0F1A;
  font-weight: 700;
  font-size: 1rem;
  padding: 14px 22px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.2s;
}
.t-submit:hover { background: #f0c030; }
.t-feedback { text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 12px; font-weight: 600; }
.t-feedback.ok { color: var(--correct); }
.t-feedback.fail { color: var(--wrong); }
.t-score { display: flex; justify-content: center; gap: 24px; margin-bottom: 14px; }
.t-streak { color: var(--accent); font-size: 0.85rem; text-align: center; margin-bottom: 8px; }

/* ─── MATCHING ─── */
#game-matching .m-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.m-timer { font-size: 1.5rem; font-weight: 700; color: var(--accent); min-width: 60px; }
.m-stats { color: var(--muted); font-size: 0.82rem; }
.m-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
/* Matching tile — no sub-label, bigger kana */
.m-tile {
  aspect-ratio: 1;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.18s;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  position: relative;
  overflow: hidden;
  user-select: none;
}
.m-tile:hover:not(.matched):not(.selected) { background: var(--card-hover); border-color: var(--accent); transform: scale(1.04); }
.m-tile.selected { border-color: var(--accent); background: #252C55; box-shadow: 0 0 0 2px var(--accent); }
.m-tile.matched { border-color: var(--correct); background: #1A3A30; color: var(--correct); cursor: default; }
.m-tile.wrong-flash { border-color: var(--wrong); background: #3A1A20; animation: wrongShake 0.35s; }
/* kana tile: big kana, no sub-text */
.m-tile.type-kana .tile-kana {
  font-size: 2.2rem;
  color: var(--accent);
  line-height: 1;
}
.m-tile.matched.type-kana .tile-kana { color: var(--correct); }
/* romaji tile: big romaji text */
.m-tile.type-rom .tile-rom {
  font-size: 1.1rem;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}
.m-tile.matched.type-rom .tile-rom { color: var(--correct); }
.m-size-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.m-size-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 0.78rem;
  padding: 6px 16px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.m-size-btn.active { border-color: var(--accent2); color: var(--accent2); background: var(--card); }
@keyframes wrongShake {
  0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}
}
/* Buttons */
.btn-start {
  border: none;
  background: var(--accent);
  color: #0D0F1A;
  font-weight: 700;
  font-size: 1rem;
  padding: 12px 30px;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-start:hover { background: #f0c030; }
/* Progress bar */
.prog-bar-wrap {
  background: var(--card);
  border-radius: 50px;
  height: 4px;
  margin-bottom: 16px;
  overflow: hidden;
}
.prog-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 50px;
  transition: width 0.3s;
}
/* ─── SETUP TOGGLE ─── */
.setup-controls {
  overflow: hidden;
  max-height: 300px;
  transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease, margin 0.3s ease;
  opacity: 1;
  margin-top: 0;
}
.setup-controls.hidden {
  max-height: 0;
  opacity: 0;
  margin-top: 0;
}
.setup-zone {
  position: relative;
}
.setup-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 5px 14px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.setup-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
.toggle-arrow {
  display: inline-block;
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  font-style: normal;
  font-size: 0.8rem;
  line-height: 1;
}
.toggle-arrow.up { transform: rotate(180deg); }

/* responsive */
@media(max-width:500px){
  .title-jp { font-size: 1.9rem; }
  .kana-big,.q-kana,.t-kana { font-size: 4.5rem; }
  .m-tile.type-kana .tile-kana { font-size: 1.7rem; }
  .m-tile.type-rom .tile-rom { font-size: 0.9rem; }
  .quiz-options { gap: 8px; }
  .opt-btn { padding: 14px 6px; font-size: 0.95rem; }
  .game-window { padding: 20px 14px; }
  .setup-zone { padding: 24px 14px 22px; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SETUP ZONE
══════════════════════════════════════ -->
<div class="setup-zone">
  <div class="title-jp">日本語学習</div>
  <div class="title-en">Japanese Learning Games</div>

  <!-- Setup controls (collapsible) -->
  <div class="setup-controls" id="setup-controls">
    <!-- Script toggle -->
    <div class="script-toggle">
      <button class="script-btn active" id="btn-hira" onclick="setScript('hiragana')">ひらがな Hiragana</button>
      <button class="script-btn" id="btn-kata" onclick="setScript('katakana')">カタカナ Katakana</button>
    </div>

    <!-- Category selector -->
    <div class="cat-row">
      <button class="cat-btn active" id="cat-basic" onclick="toggleCat('basic')">
        <span class="cat-main">🔤 Basic</span>
        <span class="cat-sub">46 ký tự cơ bản</span>
      </button>
      <button class="cat-btn" id="cat-dakuten" onclick="toggleCat('dakuten')">
        <span class="cat-main">゛゜ Dakuten</span>
        <span class="cat-sub">Dakuon &amp; Handakuon</span>
      </button>
      <button class="cat-btn" id="cat-combo" onclick="toggleCat('combo')">
        <span class="cat-main">🔀 Combo</span>
        <span class="cat-sub">Yoon: ghép や ゆ よ nhỏ</span>
      </button>
    </div>
  </div>

  <!-- Toggle button -->
  <button class="setup-toggle-btn" id="setup-toggle-btn" onclick="toggleSetup()">
    <i id="toggle-arrow" class="toggle-arrow up">▲</i>
    <span id="toggle-label">Ẩn thiết lập</span>
  </button>
</div>

<!-- ══════════════════════════════════════
     GAME ZONE
══════════════════════════════════════ -->
<div class="game-zone">

  <!-- Game tabs -->
  <div class="game-tabs">
    <button class="tab-btn active" onclick="setGame('flashcard')"><span>🃏</span> Flashcard</button>
    <button class="tab-btn" onclick="setGame('quiz')"><span>🎯</span> Quiz</button>
    <button class="tab-btn" onclick="setGame('typing')"><span>⌨️</span> Typing</button>
    <button class="tab-btn" onclick="setGame('matching')"><span>🔗</span> Matching</button>
  </div>

  <!-- Game window -->
  <div class="game-window">

    <!-- ══════ FLASHCARD ══════ -->
    <div id="game-flashcard">
      <div class="card-scene" onclick="flipCard()">
        <div class="card-3d" id="card-3d">
          <div class="card-face card-front">
            <div class="kana-big" id="fc-kana">あ</div>
            <div class="card-hint">tap to reveal →</div>
          </div>
          <div class="card-face card-back">
            <div class="romaji-big" id="fc-romaji">a</div>
            <div class="card-hint" id="fc-back-kana" style="font-family:'Noto Sans JP';font-size:1.3rem;color:var(--muted);margin-top:10px"></div>
          </div>
        </div>
      </div>
      <div class="fc-controls">
        <button onclick="fcNav(-1)">← Prev</button>
        <span class="progress-text" id="fc-progress">1 / 46</span>
        <button onclick="fcNav(1)">Next →</button>
        <button class="btn-primary" onclick="fcShuffle()">🔀 Shuffle</button>
      </div>
    </div>

    <!-- ══════ QUIZ ══════ -->
    <div id="game-quiz" style="display:none">
      <div class="quiz-score">
        <div class="score-item score-correct"><div class="score-num" id="q-correct">0</div><div class="score-label">Correct</div></div>
        <div class="score-item"><div class="score-num" style="color:var(--muted)" id="q-total">0</div><div class="score-label">Total</div></div>
        <div class="score-item score-wrong"><div class="score-num" id="q-wrong">0</div><div class="score-label">Wrong</div></div>
      </div>
      <div class="prog-bar-wrap"><div class="prog-bar" id="q-prog" style="width:0%"></div></div>
      <div class="q-card">
        <div class="q-kana" id="q-kana">?</div>
        <div class="q-prompt">Choose the correct romaji</div>
      </div>
      <div class="feedback-msg" id="q-feedback"></div>
      <div class="quiz-options" id="quiz-options"></div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn-start" onclick="startQuiz()">🔄 New Round</button>
      </div>
    </div>

    <!-- ══════ TYPING ══════ -->
    <div id="game-typing" style="display:none">
      <div class="t-score">
        <div class="score-item score-correct"><div class="score-num" id="t-correct">0</div><div class="score-label">Correct</div></div>
        <div class="score-item"><div class="score-num" style="color:var(--muted)" id="t-total">0</div><div class="score-label">Total</div></div>
        <div class="score-item score-wrong"><div class="score-num" id="t-wrong">0</div><div class="score-label">Wrong</div></div>
      </div>
      <div class="t-streak" id="t-streak-txt"></div>
      <div class="prog-bar-wrap"><div class="prog-bar" id="t-prog" style="width:0%"></div></div>
      <div class="t-card">
        <div class="t-kana" id="t-kana">?</div>
      </div>
      <div class="t-feedback" id="t-feedback"></div>
      <div class="t-input-wrap">
        <input class="t-input" id="t-input" type="text" placeholder="type romaji…" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="handleTypingKey(event)">
        <button class="t-submit" onclick="checkTyping()">✓</button>
      </div>
      <div style="text-align:center">
        <button class="btn-start" style="font-size:0.85rem;padding:10px 22px;background:var(--card);color:var(--muted);border:1px solid var(--border)" onclick="skipTyping()">Skip →</button>
      </div>
    </div>

    <!-- ══════ MATCHING ══════ -->
    <div id="game-matching" style="display:none">
      <div class="m-header">
        <div>
          <div class="m-timer" id="m-timer">0:00</div>
          <div class="m-stats">Pairs: <span id="m-pairs">0</span>/<span id="m-total-pairs">8</span> · Moves: <span id="m-moves">0</span></div>
        </div>
        <button class="btn-start" style="font-size:0.85rem;padding:10px 20px" onclick="startMatching()">🔄 New Game</button>
      </div>
      <div class="m-size-btns">
        <button class="m-size-btn active" onclick="setMatchSize(8)">8 pairs</button>
        <button class="m-size-btn" onclick="setMatchSize(12)">12 pairs</button>
      </div>
      <div class="m-grid" id="m-grid"></div>
      <div style="text-align:center;padding:8px 0">
        <div class="m-stats" id="m-result-msg" style="font-size:0.95rem;color:var(--accent3)"></div>
      </div>
    </div>

  </div><!-- /game-window -->
</div><!-- /game-zone -->

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const DATA = {
  hiragana: {
    basic: [

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let currentScript = 'hiragana';
let currentGame = 'flashcard';
let activeCategories = ['basic'];

function getPool() {
  let pool = [];
  activeCategories.forEach(c => { pool = pool.concat(DATA[currentScript][c]); });
  return pool;
}

// Set script (hiragana / katakana)
function setScript(s) {
  currentScript = s;
  document.getElementById('btn-hira').classList.toggle('active', s==='hiragana');
  document.getElementById('btn-kata').classList.toggle('active', s==='katakana');
  resetCurrentGame();
}

// Toggle category
function toggleCat(c) {
  if (activeCategories.includes(c)) {
    if (activeCategories.length === 1) return; // keep at least 1
    activeCategories = activeCategories.filter(x => x !== c);
  } else {
    activeCategories.push(c);
  }
  document.getElementById('cat-basic').classList.toggle('active', activeCategories.includes('basic'));
  document.getElementById('cat-dakuten').classList.toggle('active', activeCategories.includes('dakuten'));
  document.getElementById('cat-combo').classList.toggle('active', activeCategories.includes('combo'));
  resetCurrentGame();
}

// Switch game mode
function setGame(g) {
  currentGame = g;
  ['flashcard','quiz','typing','matching'].forEach(id => {
    document.getElementById('game-'+id).style.display = id===g ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['flashcard','quiz','typing','matching'][i]===g);
  });
  resetCurrentGame();
}

function resetCurrentGame() {
  if (currentGame==='flashcard') initFlashcard();
  if (currentGame==='quiz') startQuiz();
  if (currentGame==='typing') startTyping();
  if (currentGame==='matching') startMatching();
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function randItems(arr, n) { return shuffle(arr).slice(0, Math.min(n, arr.length)); }

// ═══════════════════════════════════════════
// FLASHCARD
// ═══════════════════════════════════════════
let fcCards = [], fcIndex = 0, fcFlipped = false;

function initFlashcard() {
  fcCards = shuffle(getPool());
  fcIndex = 0; fcFlipped = false;
  document.getElementById('card-3d').classList.remove('flipped');
  renderFCCard();
}

function renderFCCard() {
  const [kana, rom] = fcCards[fcIndex];
  document.getElementById('fc-kana').textContent = kana;
  document.getElementById('fc-romaji').textContent = rom;
  document.getElementById('fc-back-kana').textContent = kana;
  document.getElementById('fc-progress').textContent = (fcIndex+1)+' / '+fcCards.length;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('card-3d').classList.toggle('flipped', fcFlipped);
}

function fcNav(dir) {
  fcIndex = (fcIndex + dir + fcCards.length) % fcCards.length;
  fcFlipped = false;
  document.getElementById('card-3d').classList.remove('flipped');
  renderFCCard();
}

function fcShuffle() {
  fcCards = shuffle(getPool()); fcIndex = 0; fcFlipped = false;
  document.getElementById('card-3d').classList.remove('flipped');
  renderFCCard();
}

// ═══════════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════════
let qPool = [], qIndex = 0, qCorrect = 0, qWrong = 0, qAnswered = false;

function startQuiz() {
  qPool = shuffle(getPool());
  qIndex = 0; qCorrect = 0; qWrong = 0; qAnswered = false;
  updateQScore(); renderQuestion();
}

function renderQuestion() {
  if (qIndex >= qPool.length) { qPool = shuffle(getPool()); qIndex = 0; }
  const pool = getPool();
  const [kana, correct] = qPool[qIndex];
  document.getElementById('q-kana').textContent = kana;
  document.getElementById('q-feedback').textContent = '';
  document.getElementById('q-feedback').className = 'feedback-msg';
  let wrongs = pool.filter(x => x[1] !== correct);
  wrongs = shuffle(wrongs).slice(0,3).map(x=>x[1]);
  const opts = shuffle([correct, ...wrongs]);
  const wrap = document.getElementById('quiz-options');
  wrap.innerHTML = '';
  opts.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt-btn'; b.textContent = opt;
    b.onclick = () => selectAnswer(b, opt, correct);
    wrap.appendChild(b);
  });
  qAnswered = false;
  document.getElementById('q-prog').style.width = Math.min(100, ((qCorrect+qWrong)/(qPool.length||1))*100)+'%';
}

function selectAnswer(btn, chosen, correct) {
  if (qAnswered) return;
  qAnswered = true;
  const fb = document.getElementById('q-feedback');
  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = '✓ Correct!'; fb.className = 'feedback-msg ok'; qCorrect++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ Wrong — answer: ' + correct; fb.className = 'feedback-msg fail'; qWrong++;
    document.querySelectorAll('.opt-btn').forEach(b => { if (b.textContent===correct) b.classList.add('correct'); });
  }
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  updateQScore(); qIndex++;
  setTimeout(renderQuestion, 1000);
}

function updateQScore() {
  document.getElementById('q-correct').textContent = qCorrect;
  document.getElementById('q-wrong').textContent = qWrong;
  document.getElementById('q-total').textContent = qCorrect+qWrong;
}

// ═══════════════════════════════════════════
// TYPING
// ═══════════════════════════════════════════
let tPool = [], tIndex = 0, tCorrect = 0, tWrong = 0, tStreak = 0;

function startTyping() {
  tPool = shuffle(getPool());
  tIndex = 0; tCorrect = 0; tWrong = 0; tStreak = 0;
  updateTScore(); renderTyping();
}

function renderTyping() {
  if (tIndex >= tPool.length) { tPool = shuffle(getPool()); tIndex = 0; }
  const [kana] = tPool[tIndex];
  document.getElementById('t-kana').textContent = kana;
  document.getElementById('t-feedback').textContent = '';
  document.getElementById('t-feedback').className = 't-feedback';
  const inp = document.getElementById('t-input');
  inp.value = ''; inp.className = 't-input'; inp.focus();
  document.getElementById('t-prog').style.width = Math.min(100, ((tCorrect+tWrong)/(tPool.length||1))*100)+'%';
  updateStreakDisplay();
}

function handleTypingKey(e) { if (e.key==='Enter') checkTyping(); }

function checkTyping() {
  const inp = document.getElementById('t-input');
  const answer = inp.value.trim().toLowerCase();
  const [, correct] = tPool[tIndex];
  const fb = document.getElementById('t-feedback');
  if (!answer) { inp.focus(); return; }
  if (correct.split('/').includes(answer)) {
    inp.className = 't-input correct';
    fb.textContent = '✓ Correct!'; fb.className = 't-feedback ok';
    tCorrect++; tStreak++;
    updateTScore(); tIndex++;
    setTimeout(renderTyping, 700);
  } else {
    inp.className = 't-input wrong';
    fb.textContent = '✗ Answer: ' + correct; fb.className = 't-feedback fail';
    tWrong++; tStreak = 0;
    updateTScore(); tIndex++;
    setTimeout(renderTyping, 900);
  }
}

function skipTyping() { tStreak = 0; tIndex++; renderTyping(); }

function updateTScore() {
  document.getElementById('t-correct').textContent = tCorrect;
  document.getElementById('t-wrong').textContent = tWrong;
  document.getElementById('t-total').textContent = tCorrect+tWrong;
  updateStreakDisplay();
}

function updateStreakDisplay() {
  const el = document.getElementById('t-streak-txt');
  if (tStreak >= 3) {
    const fire = tStreak >= 5 ? '🔥🔥🔥' : tStreak >= 4 ? '🔥🔥' : '🔥';
    el.textContent = fire + ' Streak: ' + tStreak;
  } else { el.textContent = ''; }
}

// ═══════════════════════════════════════════
// MATCHING
// ═══════════════════════════════════════════
let matchSize = 8, matchTiles = [], matchSelected = null, matchPairs = 0, matchMoves = 0;
let matchTimer = 0, matchInterval = null, matchDone = false;

function setMatchSize(n) {
  matchSize = n;
  document.querySelectorAll('.m-size-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().startsWith(n));
  });
  startMatching();
}

function startMatching() {
  clearInterval(matchInterval);
  matchTimer = 0; matchPairs = 0; matchMoves = 0; matchSelected = null; matchDone = false;
  document.getElementById('m-result-msg').textContent = '';
  document.getElementById('m-total-pairs').textContent = matchSize;

  const pool = randItems(getPool(), matchSize);
  matchTiles = [];
  pool.forEach((pair, i) => {
    matchTiles.push({ id: i*2,   pairId: i, type: 'kana', display: pair[0], matched: false });
    matchTiles.push({ id: i*2+1, pairId: i, type: 'rom',  display: pair[1], matched: false });
  });
  matchTiles = shuffle(matchTiles);
  renderMatchGrid(); updateMatchStats();
  matchInterval = setInterval(() => { if (!matchDone) { matchTimer++; updateMatchTimer(); } }, 1000);
}

function renderMatchGrid() {
  const grid = document.getElementById('m-grid');
  grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
  grid.innerHTML = '';
  matchTiles.forEach(tile => {
    const el = document.createElement('div');
    el.className = 'm-tile type-' + tile.type + (tile.matched ? ' matched' : '');
    el.dataset.id = tile.id;
    if (tile.type === 'kana') {
      el.innerHTML = `<span class="tile-kana">${tile.display}</span>`;
    } else {
      el.innerHTML = `<span class="tile-rom">${tile.display}</span>`;
    }
    if (!tile.matched) el.onclick = () => selectMatchTile(tile.id);
    grid.appendChild(el);
  });
}

function selectMatchTile(id) {
  if (matchDone) return;
  const tile = matchTiles.find(t => t.id===id);
  if (!tile || tile.matched) return;
  const el = document.querySelector(`.m-tile[data-id="${id}"]`);

  if (matchSelected === null) {
    matchSelected = id; el.classList.add('selected'); return;
  }
  if (matchSelected === id) {
    el.classList.remove('selected'); matchSelected = null; return;
  }

  const prev = matchTiles.find(t => t.id===matchSelected);
  const prevEl = document.querySelector(`.m-tile[data-id="${matchSelected}"]`);
  matchMoves++;

  if (prev.pairId === tile.pairId) {
    prev.matched = true; tile.matched = true;
    prevEl.classList.remove('selected'); prevEl.classList.add('matched');
    el.classList.add('matched');
    matchPairs++; matchSelected = null;
    updateMatchStats();
    if (matchPairs === matchSize) {
      matchDone = true; clearInterval(matchInterval);
      const m = Math.floor(matchTimer/60), s = matchTimer%60;
      document.getElementById('m-result-msg').innerHTML = `🎉 Cleared in ${m}:${String(s).padStart(2,'0')} with ${matchMoves} moves!`;
    }
  } else {
    el.classList.add('wrong-flash'); prevEl.classList.add('wrong-flash');
    matchSelected = null;
    setTimeout(() => {
      el.classList.remove('wrong-flash','selected');
      prevEl.classList.remove('wrong-flash','selected');
    }, 400);
  }
  updateMatchStats();
}

function updateMatchTimer() {
  const m = Math.floor(matchTimer/60), s = matchTimer%60;
  document.getElementById('m-timer').textContent = m+':'+String(s).padStart(2,'0');
}
function updateMatchStats() {
  document.getElementById('m-pairs').textContent = matchPairs;
  document.getElementById('m-moves').textContent = matchMoves;
}

  setupVisible = !setupVisible;

  const arrow = document.getElementById('toggle-arrow');
  const label = document.getElementById('toggle-label');
  ctrl.classList.toggle('hidden', !setupVisible);
  arrow.classList.toggle('up', setupVisible);
  label.textContent = setupVisible ? 'Ẩn thiết lập' : 'Hiện thiết lập';
}

initFlashcard();
startQuiz();
